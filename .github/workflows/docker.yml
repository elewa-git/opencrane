name: Validate and publish affected deployables

on:
  push:
    branches:
      - main
      - develop
      - own-personal-ai-agent-setup
  # Stacked PRs target feature branches. Validate every PR base so descendants receive the same
  # build/test gate as integration-root changes.
  pull_request:
  workflow_dispatch:
    inputs:
      heavy_qualification:
        description: Run heavyweight qualification even when the affected graph does not select it
        required: true
        type: choice
        default: none
        options:
          - none
          - image-smoke
          - k3d
          - all
      publish_deployables:
        description: Publish the named deployable image set from this exact commit
        required: true
        type: choice
        default: none
        options:
          - none
          - bootstrap
          - artifact
          - qualification
          - server
          - ui

# One live run per ref: a new push supersedes the in-flight PR validation of the stale commit.
# Pushes to the integration branches are never cancelled mid-publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

env:
  REGISTRY: ghcr.io
  # Image layer cache lives in registry repositories with one tag per deployable. The registry
  # backend replaced the GitHub Actions cache backend because the 10GB Actions cache quota evicted
  # the large layer blobs on almost every run, so every build started cold.
  #
  # Two repositories form a trust boundary: only integration-branch pushes write the trusted
  # cache, and published image builds read only the trusted cache. Same-repository pull requests
  # read both but write only the pull-request cache, so a layer produced by unreviewed code can
  # never become part of a published image.
  BUILD_CACHE_IMAGE: opencrane-buildcache
  BUILD_CACHE_IMAGE_PR: opencrane-buildcache-pr

jobs:
  prepare:
    name: Calculate affected work
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      nx_base: ${{ steps.affected.outputs.nx_base }}
      nx_head: ${{ steps.affected.outputs.nx_head }}
      guard_base: ${{ steps.guard-base.outputs.guard_base }}
      deployables: ${{ steps.affected.outputs.deployables }}
      has_deployables: ${{ steps.affected.outputs.has_deployables }}
      image_smokes: ${{ steps.affected.outputs.image_smokes }}
      has_image_smokes: ${{ steps.affected.outputs.has_image_smokes }}
      develop_smoke_images: ${{ steps.affected.outputs.develop_smoke_images }}
      develop_smoke_projects: ${{ steps.affected.outputs.develop_smoke_projects }}
      api_contract_changed: ${{ steps.affected.outputs.api_contract_changed }}
      develop_smoke_can_skip: ${{ steps.develop-smoke-baseline.outputs.develop_smoke_can_skip }}
      develop_smoke_storage_mode: ${{ steps.affected.outputs.develop_smoke_storage_mode }}
      guard_inputs_changed: ${{ steps.affected.outputs.guard_inputs_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Select the last successful base
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}

      # The full main...develop range still drives builds, smoke selection, and publication. Diff-
      # scoped policy guards may trust the source only after this exact develop SHA passed its push
      # workflow; ordinary branches, adjusted merge trees, and unvalidated promotions stay on the
      # full last-successful base.
      - name: Select the validated policy comparison base
        id: guard-base
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/promotion-guard-base.mjs

      - name: Prove app-owned deployable selection
        run: npm run test:affected-deployables

      - name: Emit affected deployable matrix
        id: affected
        env:
          FORCE_DEPLOYABLES: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_deployables || '' }}
          FORCE_HEAVY_QUALIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.heavy_qualification || '' }}
        run: node scripts/affected-deployables.mjs

      # This is one positive skip proof. API failure, missing output, a base without an exact-SHA
      # push/dispatch k3d job, affected containers, or any unclassified path all retain k3d.
      - name: Prove the exact base current-silo baseline remains reusable
        id: develop-smoke-baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NX_BASE: ${{ steps.affected.outputs.nx_base }}
          AFFECTED_CONTAINER_PROJECTS: ${{ steps.affected.outputs.affected_container_projects }}
          DEPLOYMENT_INPUTS_CHANGED: ${{ steps.affected.outputs.develop_smoke_inputs_changed }}
        run: node scripts/develop-smoke-baseline.mjs

  test:
    name: Build, test, and lint affected projects
    runs-on: ubuntu-latest
    # A hung step must fail fast: an untimed job once held a runner for hours on a stuck
    # apt install and starved the whole queue.
    timeout-minutes: 45
    needs: prepare
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opencrane
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opencrane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opencrane
      NX_BASE: ${{ needs.prepare.outputs.nx_base }}
      NX_HEAD: ${{ needs.prepare.outputs.nx_head }}
      GUARD_BASE: ${{ needs.prepare.outputs.guard_base }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Helm for topology render validation
        uses: azure/setup-helm@v5
        with:
          # Pinned to the version local deploys and the render-parity evidence used —
          # renders must not drift with the runner image or a new Helm release.
          version: v4.1.4

      - name: Install Terraform for provisioning validation
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - name: Validate Terraform provisioning
        working-directory: apps/_infra/deploy-k8s/platform/terraform
        env:
          TF_DATA_DIR: ${{ runner.temp }}/opencrane-terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color

      # The runner image already ships the PostgreSQL client. ripgrep comes as a pinned static
      # binary because a full apt update/install spent ~30s per run and can hang on apt locks.
      - name: Install validation clients
        env:
          RIPGREP_VERSION: 14.1.1
          RIPGREP_SHA256: 4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update && sudo apt-get install --yes --no-install-recommends postgresql-client
          fi
          curl --location --fail --silent --show-error --output /tmp/ripgrep.tar.gz \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${RIPGREP_SHA256}  /tmp/ripgrep.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/ripgrep.tar.gz --directory /tmp
          sudo install --mode 0755 "/tmp/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg

      - name: Enforce workload ownership and app composition
        run: npm run check:workload-ownership-app-composition

      - name: Prove workload ownership and app composition reject drift
        # Tests the guard, not the repo — re-prove only when the guard or its inputs change.
        if: needs.prepare.outputs.guard_inputs_changed == 'true' || github.event_name == 'push'
        run: npm run test:workload-ownership-app-composition

      - name: Enforce personal, execution, and operator agent domains
        run: npm run check:agent-domain-boundary

      - name: Prove the agent-domain boundary rejects drift
        run: npm run test:agent-domain-boundary

      - name: Enforce mechanical TypeScript agent style
        run: scripts/agent-style-check.sh --diff "$GUARD_BASE"

      - name: Prove the inline-conditional classifier
        run: npm run test:agent-style

      - name: Prove the agent-context integration contract
        run: npm run test:agent-context

      - name: Enforce language-neutral production module growth
        run: npm run check:module-growth -- --diff "$GUARD_BASE"

      - name: Prove the module-growth classifier
        run: npm run test:module-growth

      - name: Enforce release versions and migration history
        run: npm run check:release-versioning -- --base "$GUARD_BASE"

      - name: Prove the release-versioning classifier
        run: npm run test:release-versioning

      - name: Prove the PR-stack integrity classifier
        run: npm run test:pr-stack-integrity

      - name: Prove configuration documentation coverage
        run: npm run test:config-docs-coverage

      - name: Enforce operator configuration documentation
        run: scripts/config-docs-coverage.sh --strict

      - name: Enforce Prisma repository and unit-of-work ownership
        run: npm run check:prisma-boundaries -- --diff "$GUARD_BASE"

      - name: Prove the Prisma-boundary classifier
        run: npm run test:prisma-boundaries

      - name: Enforce durable execution engine boundaries
        run: npm run check:durable-boundary

      - name: Prove the durable execution boundary classifier
        run: npm run test:durable-boundary

      - name: Restore the Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build, test, and lint affected projects
        run: npx nx affected -t build test lint

      - name: Enforce monorepo dependency boundaries
        run: npm run lint:boundaries

  # The PostgreSQL-bound proofs run beside the main test job instead of serially inside it:
  # database generation, the target baseline, the SQL authority suites, and the migration
  # convergence proofs together took minutes off the test job's critical path.
  database:
    name: Database authority and migration proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: prepare
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opencrane
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opencrane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opencrane
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # The runner image ships the PostgreSQL client; install it only if that ever changes.
      - name: Install the PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update && sudo apt-get install --yes --no-install-recommends postgresql-client
          fi

      - name: Build the pg_cron migration fixture
        run: docker build --platform linux/amd64 --tag opencrane-postgres:migration-test --file apps/postgres/deploy/Dockerfile .

      - name: Enforce version-to-version database migration contracts
        run: npm run check:database-migrations

      - name: Prove direct database migration SQL contract
        run: npm run test:database-migrations

      - name: Generate the database client
        run: npm run db:generate -w @opencrane/server

      - name: Verify the reviewed target authority baseline is intact
        run: npm run test:authority-baseline -w @opencrane/server

      - name: Apply the fresh target database baseline
        run: psql "$DATABASE_URL" -X --set=ON_ERROR_STOP=1 --file=apps/opencrane/prisma/bootstrap/target-baseline.sql

      # Every suite validates the shared target baseline. A baseline-only change belongs to the
      # opencrane app and therefore cannot make the library-owned SQL suites "affected" in Nx.
      - name: Run every PostgreSQL authority suite
        run: npx nx run-many -t test:sql --parallel=1

  # The API contract check builds the full server, so when the contract changed it added
  # minutes to the test job. It only needs the prepare outputs and runs beside it instead.
  api_contract:
    name: API reference and generated client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: prepare
    if: needs.prepare.outputs.api_contract_changed == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Restore the Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Verify API reference and generated client
        run: |
          npx nx run opencrane:build
          npm run sync-openapi -w @opencrane/website
          git diff --exit-code -- website/public/openapi.json
          npx nx run contracts:generate
          git diff --exit-code -- libs/contracts/src/generated/api.ts

  # Storybook visual regressions run beside the main test job instead of serially after it:
  # the Chromium install and the Storybook build/test chain used to extend the critical path
  # by several minutes whenever a frontend project was affected.
  storybook_visual:
    name: Storybook component contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: prepare
    env:
      NX_BASE: ${{ needs.prepare.outputs.nx_base }}
      NX_HEAD: ${{ needs.prepare.outputs.nx_head }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Detect affected Storybook regression coverage
        id: storybook-regression
        shell: bash
        run: |
          AFFECTED_STORYBOOK_PROJECTS="$(npx nx show projects --affected --with-target=test-storybook-visual --base="$NX_BASE" --head="$NX_HEAD")"
          if [[ -n "$AFFECTED_STORYBOOK_PROJECTS" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the Nx computation cache
        if: steps.storybook-regression.outputs.required == 'true'
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # The browser binaries change only with the lockfile, so they restore from cache instead
      # of downloading each run. On a cache hit the apt-driven install-deps is skipped entirely:
      # the runner image already carries Chromium's system libraries, and the apt step has hung
      # for tens of minutes on runner apt locks.
      - name: Restore the Playwright browser cache
        if: steps.storybook-regression.outputs.required == 'true'
        id: playwright-browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for affected Storybook regressions
        if: steps.storybook-regression.outputs.required == 'true' && steps.playwright-browsers.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Build and test affected Storybook component contracts
        if: steps.storybook-regression.outputs.required == 'true'
        run: npx nx affected -t build-storybook test-storybook test-storybook-visual --base="$NX_BASE" --head="$NX_HEAD" --parallel=1

      - name: Upload failed Storybook visual evidence
        if: failure() && steps.storybook-regression.outputs.required == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: storybook-visual-evidence-${{ github.run_attempt }}
          path: .nx/test-results/storybook
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  develop_smoke:
    name: k3d current-silo smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: prepare
    permissions:
      contents: read
      # Write lets the smoke publish its layer cache so the next run builds warm. GitHub
      # downgrades the token to read-only for pull requests from forks, and the smoke then
      # skips the cache export (see SMOKE_BUILD_CACHE_PUSH below).
      packages: write
    # Every accepted develop commit proves the current deployment path. A pull request skips the
    # live cluster only when its exact base SHA already completed the same k3d job successfully.
    # Missing or malformed proof output deliberately compares unequal to true and runs k3d.
    if: >-
      ${{
        (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
        (github.event_name == 'pull_request' &&
          needs.prepare.outputs.develop_smoke_can_skip != 'true') ||
        (github.event_name == 'workflow_dispatch' &&
          (inputs.heavy_qualification == 'k3d' || inputs.heavy_qualification == 'all'))
      }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # The production deploy wrapper resolves and schema-validates the database transition before
      # it mutates the cluster. The smoke job is a fresh checkout, so restore the same exact
      # lockfile-bound runtime dependencies that the prepare and test jobs use.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install deploy validation dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install k3d
        env:
          K3D_VERSION: v5.8.3
          K3D_LINUX_AMD64_SHA256: dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e
        run: |
          curl --location --fail --silent --show-error \
            --output /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_LINUX_AMD64_SHA256}  /tmp/k3d" | sha256sum --check
          sudo install --mode 0755 /tmp/k3d /usr/local/bin/k3d

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.1.4

      - name: Log in to the validated develop image set
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run the current-silo smoke
        run: ./apps/_infra/deploy-k8s/platform/tests/develop-smoke.sh
        env:
          KEEP_CLUSTER: "0"
          # 600 gives the loaded two-CPU runner headroom: the server pod's boot grew with the
          # public health report and initial model seeding, and a healthy wait returns early.
          TIMEOUT_SECONDS: "600"
          SMOKE_AFFECTED_PROJECTS: ${{ needs.prepare.outputs.develop_smoke_projects }}
          SMOKE_BASE_SHA: ${{ needs.prepare.outputs.nx_base }}
          SMOKE_REGISTRY: ${{ env.REGISTRY }}/${{ github.repository_owner }}
          SMOKE_STORAGE_MODE: ${{ needs.prepare.outputs.develop_smoke_storage_mode }}
          SMOKE_BUILD_CACHE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.BUILD_CACHE_IMAGE }}
          SMOKE_BUILD_CACHE_UNTRUSTED: ${{ github.event_name == 'pull_request' && format('{0}/{1}/{2}', env.REGISTRY, github.repository_owner, env.BUILD_CACHE_IMAGE_PR) || '' }}
          # Integration pushes refresh the trusted cache; same-repository pull requests export
          # only the pull-request cache; fork pull requests (read-only token) export nothing.
          SMOKE_BUILD_CACHE_EXPORT: ${{ github.event_name == 'push' && format('{0}/{1}/{2}', env.REGISTRY, github.repository_owner, env.BUILD_CACHE_IMAGE) || (github.event.pull_request.head.repo.full_name == github.repository && format('{0}/{1}/{2}', env.REGISTRY, github.repository_owner, env.BUILD_CACHE_IMAGE_PR) || '') }}

  image_smoke:
    name: Image smoke (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: prepare
    if: needs.prepare.outputs.has_image_smokes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.image_smokes) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install image smoke dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run the app-owned image smoke
        env:
          IMAGE_SMOKE_PROJECT: ${{ matrix.project }}
        run: npx nx run "$IMAGE_SMOKE_PROJECT:image-smoke"

  build-and-push:
    name: Build and publish affected images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [prepare, test, database, api_contract, storybook_visual, develop_smoke, image_smoke]
    if: >-
      ${{
        always() &&
        needs.prepare.outputs.has_deployables == 'true' &&
        needs.test.result == 'success' &&
        needs.database.result == 'success' &&
        (needs.api_contract.result == 'success' || needs.api_contract.result == 'skipped') &&
        needs.storybook_visual.result == 'success' &&
        (needs.develop_smoke.result == 'success' || needs.develop_smoke.result == 'skipped') &&
        (needs.image_smoke.result == 'success' || needs.image_smoke.result == 'skipped')
      }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.deployables) }}
    steps:
      - uses: actions/checkout@v6

      # Validation-only runs also log in: pulling the registry layer cache needs an
      # authenticated token even when nothing is pushed.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and publish ${{ matrix.project }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_deployables != 'none') }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          # Publishable builds (push events) read only the trusted cache. Pull-request
          # validation builds also read the pull-request cache and export only there; fork
          # pull requests (read-only token) export nothing.
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.BUILD_CACHE_IMAGE }}:${{ matrix.project }}
            ${{ github.event_name == 'pull_request' && format('type=registry,ref={0}/{1}/{2}:{3}', env.REGISTRY, github.repository_owner, env.BUILD_CACHE_IMAGE_PR, matrix.project) || '' }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}/{1}/{2}:{3},mode=max', env.REGISTRY, github.repository_owner, env.BUILD_CACHE_IMAGE, matrix.project) || (github.event.pull_request.head.repo.full_name == github.repository && format('type=registry,ref={0}/{1}/{2}:{3},mode=max', env.REGISTRY, github.repository_owner, env.BUILD_CACHE_IMAGE_PR, matrix.project) || '') }}

      # CloudNativePG reads the PostgreSQL version from the manifest's tag, while the digest fixes
      # the qualified image's bytes. Publish that tag as an alias for the manifest's digest in the
      # job that holds `packages: write`, so no second build can change the bytes behind the release
      # reference.
      # @see https://cloudnative-pg.io/docs/1.27/container_images/#image-tag-requirements
      - name: Publish the manifest-bound CloudNativePG operand tag
        if: matrix.project == 'postgres' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_deployables != 'none'))
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          release_version="$(jq -r '.version' package.json)"
          operand_image="$(jq -r '.database.operandImage' "releases/${release_version}.json")"
          operand_tag="${operand_image%@*}"
          operand_digest="${operand_image##*@}"
          if [[ "$operand_tag" != "${IMAGE_REPOSITORY}:"* ]]; then
            echo "The release manifest's PostgreSQL operand does not use the matrix image repository." >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$operand_tag" "${IMAGE_REPOSITORY}@${operand_digest}"

  publish-develop-smoke-images:
    name: Publish develop smoke image (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [prepare, test, database, api_contract, storybook_visual, develop_smoke, image_smoke, build-and-push]
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/develop' &&
        needs.test.result == 'success' &&
        needs.database.result == 'success' &&
        (needs.api_contract.result == 'success' || needs.api_contract.result == 'skipped') &&
        needs.storybook_visual.result == 'success' &&
        needs.develop_smoke.result == 'success' &&
        (needs.image_smoke.result == 'success' || needs.image_smoke.result == 'skipped') &&
        (needs['build-and-push'].result == 'success' || needs['build-and-push'].result == 'skipped')
      }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.develop_smoke_images) }}
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve the complete immutable image set
        id: image-set
        shell: bash
        env:
          NX_BASE: ${{ needs.prepare.outputs.nx_base }}
          REMOTE_REPOSITORY: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          current_ref="${REMOTE_REPOSITORY}:sha-${GITHUB_SHA}"
          base_ref="${REMOTE_REPOSITORY}:sha-${NX_BASE}"
          echo "current_ref=$current_ref" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$current_ref" >/dev/null 2>&1; then
            echo "action=existing" >> "$GITHUB_OUTPUT"
          elif [[ "$base_ref" != "$current_ref" ]] && docker buildx imagetools inspect "$base_ref" >/dev/null 2>&1; then
            echo "action=copy" >> "$GITHUB_OUTPUT"
          else
            echo "action=build" >> "$GITHUB_OUTPUT"
          fi

      - name: Carry the unchanged validated image forward
        if: steps.image-set.outputs.action == 'copy'
        env:
          BASE_REF: ${{ steps.image-set.outputs.base_ref }}
          CURRENT_REF: ${{ steps.image-set.outputs.current_ref }}
        run: docker buildx imagetools create --tag "$CURRENT_REF" "$BASE_REF"

      - name: Bootstrap a missing validated image
        if: steps.image-set.outputs.action == 'build'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image-set.outputs.current_ref }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.BUILD_CACHE_IMAGE }}:${{ matrix.project }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.BUILD_CACHE_IMAGE }}:${{ matrix.project }},mode=max
