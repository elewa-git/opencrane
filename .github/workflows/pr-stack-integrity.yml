name: Enforce pull-request stack integrity

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, closed]
  workflow_dispatch:

# Every PR mutation can change another PR's ancestry. Serialize the repository-wide snapshot so a
# later event replaces evidence from an older graph.
concurrency:
  group: pr-stack-integrity-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  integrity:
    name: Prove review topology and ancestry
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted repository tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate the live PR graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/pr-stack-integrity.mjs
          --event-pr "${{ github.event.pull_request.number }}"
          --event-action "${{ github.event.action }}"
          --event-head "${{ github.event.pull_request.head.sha }}"
          --evidence pr-stack-integrity-evidence.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload SHA-bound evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-stack-integrity-${{ github.event.pull_request.head.sha || github.sha }}
          path: pr-stack-integrity-evidence.json
          if-no-files-found: error
          retention-days: 30
