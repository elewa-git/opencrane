# Disposable k3d overrides for develop-smoke.sh. Nx-affected workloads are built from the checkout;
# unaffected workloads use the digest-validated baseline. Third-party planes remain pinned.
clustertenantManager:
  image:
    repository: opencrane/opencrane-server
    tag: develop-smoke
    pullPolicy: IfNotPresent
  cognee:
    persistence:
      size: 1Gi

controlPlaneSpa:
  image:
    repository: opencrane/opencrane-ui
    tag: develop-smoke
    pullPolicy: IfNotPresent

channelProxy:
  image:
    repository: opencrane/channel-proxy
    tag: develop-smoke
    pullPolicy: IfNotPresent
  ingressNamespace: kube-system

memoryGateway:
  image:
    repository: opencrane/memory-gateway
    tag: develop-smoke
    pullPolicy: IfNotPresent

artifactService:
  image:
    repository: opencrane/artifact-service
    tag: develop-smoke
    pullPolicy: IfNotPresent
  persistence:
    size: 1Gi

ingress:
  className: traefik

networkPolicy:
  ingressNamespace: kube-system
