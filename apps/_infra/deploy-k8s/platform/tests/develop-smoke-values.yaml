# Disposable k3d overrides for develop-smoke.sh. Nx-affected workloads are built from the checkout;
# unaffected workloads use the digest-validated baseline. External vendor planes remain pinned.
clustertenantManager:
  image:
    repository: opencrane/opencrane-server
    tag: develop-smoke
    pullPolicy: IfNotPresent
  cognee:
    image:
      repository: opencrane/cognee
      tag: develop-smoke
      digest: ""
      pullPolicy: IfNotPresent
    persistence:
      size: 1Gi

controlPlaneSpa:
  image:
    repository: opencrane/opencrane-ui
    tag: develop-smoke
    pullPolicy: IfNotPresent

memoryGateway:
  image:
    repository: opencrane/memory-gateway
    tag: develop-smoke
    pullPolicy: IfNotPresent

artifactService:
  image:
    repository: opencrane/artifact-service
    tag: develop-smoke
    pullPolicy: IfNotPresent
  persistence:
    size: 1Gi

historyStore:
  kurrentdb:
    enabled: true
    image:
      # CI uses the same 26.1.1 amd64 OCI manifest; the vendor's tag also serves a legacy manifest.
      digest: sha256:e5c9d59716174a4a47f9d54d6ce45aaaca48114b7ee668135aeb9f16934d74c8
    persistence:
      size: 1Gi
    backup:
      # This disposable readiness check does not qualify backup or restore.
      enabled: false

agentSandbox:
  enabled: true
  runtimeClassName: opencrane-smoke-runc
  profiles:
    - name: developer
      poolName: developer-pool
      warmReplicas: 0
      image:
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

ingress:
  className: traefik

networkPolicy:
  ingressNamespace: kube-system
