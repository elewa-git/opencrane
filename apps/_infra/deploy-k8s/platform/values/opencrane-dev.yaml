# opencrane-dev GKE overlay — layer on top of gcp.yaml.
#
# Cluster: gke_weownai-proto_europe-west1_opencrane-dev  (project weownai-proto)
# Base domain: dev.opencrane.ai
#
# Use this overlay with apps/_infra/deploy-k8s/deploy.sh for one silo. It supplies only
# cluster-specific nonsecret values. The deployment command must also name the silo,
# domain, first owner, immutable images and existing credential Secrets described in
# apps/_infra/deploy-k8s/platform/README.md. Shared controllers are separate prerequisites.

global:
  environment: dev

ingress:
  domain: dev.opencrane.ai

historyStore:
  kurrentdb:
    # This cluster's node-local DNS resolver is outside the kube-dns Pod selector.
    dnsResolverCidrs:
      - 169.254.20.10/32
