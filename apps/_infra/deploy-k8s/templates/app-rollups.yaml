{{- $skillAuthoring := index .Values "opencrane-skill-authoring" -}}
{{- $toolRunner := index .Values "opencrane-tool-runner" -}}
{{- if eq $skillAuthoring.skillAuthoring.namespace $toolRunner.toolRunner.namespace -}}
{{- fail "skill-authoring and tool-runner namespaces must remain distinct" -}}
{{- end -}}
{{- if .Values.agentController.enabled -}}
{{- $managedEgress := .Values.managedAgentRuntimePlane.managedAgentRuntime.egress -}}
{{- if ne (int $managedEgress.channelProxyPort) (int .Values.channelProxy.service.port) -}}
{{- fail "managed runtime channelProxyPort must match channelProxy.service.port" -}}
{{- end -}}
{{- if ne (int $managedEgress.artifactServicePort) (int .Values.artifactService.service.port) -}}
{{- fail "managed runtime artifactServicePort must match artifactService.service.port" -}}
{{- end -}}
{{- end -}}
