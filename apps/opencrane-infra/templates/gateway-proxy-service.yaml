{{- /* ClusterIP exposing the in-process identity-routing gateway proxy (DOMAIN.T4), now
       SILO-local (Stage 5): the proxy runs in the opencrane-server pod, so this Service
       selects that component and renders whenever gatewayProxy.enabled — INDEPENDENT of
       fleetManager.enabled, so a per-silo install (fleetManager.enabled=false) still exposes
       it. The wildcard Ingress routes the gateway WS upgrade to this Service; it forwards to
       each user's pod by resolved identity. */ -}}
{{- if and .Values.multiCt.enabled (not .Values.gatewayProxy.enabled) }}
{{- fail "multiCt.enabled=true requires gatewayProxy.enabled=true: the per-ClusterTenant host model serves every org at a single host <org>.<domain> and the operator's in-process gateway proxy is what fans that one host out to each user's pod — a multi-org install with the proxy off has no way to reach tenant pods (the ingress /gateway route is not rendered). Set gatewayProxy.enabled=true (and, per values.schema.json, ingress.externalIp + tenant.gateway.trustedProxies), or drop the --multi-ct profile for a single-tenant box." }}
{{- end }}
{{- if .Values.gatewayProxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencrane.fullname" . }}-gateway-proxy
  labels:
    {{- include "opencrane.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-proxy
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gatewayProxy.port }}
      targetPort: gateway-proxy
      protocol: TCP
      name: gateway-proxy
  selector:
    {{- include "opencrane.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: opencrane-server
{{- end }}
