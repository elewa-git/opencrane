<wo-journey-shell
	title="Join the current Tier 2 session"
	description="This tab has not joined the current local-development session."
	[layout]="layout"
>
	<p-message journey-status severity="info" [closable]="false">
		Continue through the current launcher before using the local application.
	</p-message>
	<p class="tier2-session-help__privacy">
		The private browser session changes on every launch. Do not share the redirected URL.
	</p>
	<a pButton journey-actions class="tier2-session-help__action" href="/api/v1/auth/development-session">Open current Tier 2 session</a>
</wo-journey-shell>
