<wo-journey-shell
	title="Open the private URL printed by the Tier 2 launcher"
	description="This tab has not joined the current local-development session."
	[layout]="layout"
>
	<p-message journey-status severity="info" [closable]="false">
		Tier 2 requires the private browser URL generated for this launch.
	</p-message>
	<ol class="tier2-session-help__steps">
		<li>Keep the Tier 2 command running.</li>
		<li>Find the line beginning <code>Open the private Tier 2 browser URL:</code> in that terminal.</li>
		<li>Open the complete URL in this tab.</li>
	</ol>
	<p class="tier2-session-help__privacy">The URL changes on every launch. Do not share it.</p>
</wo-journey-shell>
