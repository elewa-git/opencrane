{{- if .Values.migration.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opencrane.postgres.fullname" . }}-database-migration
  labels:
    {{- include "opencrane.postgres.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-database-migration
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "opencrane.postgres.fullname" . }}-database-migration
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    {{- include "opencrane.postgres.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-database-migration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ add .Values.migration.timeoutSeconds .Values.migration.jobDeadlineGraceSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "opencrane.postgres.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/part-of: opencrane
        app.kubernetes.io/component: postgres-database-migration
    spec:
      serviceAccountName: {{ include "opencrane.postgres.fullname" . }}-database-migration
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.migration.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ .Values.migration.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          env:
            # Prisma reads the URI, while psql reads fields from the same application Secret so
            # both clients use the published credentials without parsing the URI in this Job.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-opencrane-app" (include "opencrane.postgres.fullname" .) | quote }}
                  key: uri
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-opencrane-app" (include "opencrane.postgres.fullname" .) | quote }}
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-opencrane-app" (include "opencrane.postgres.fullname" .) | quote }}
                  key: port
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-opencrane-app" (include "opencrane.postgres.fullname" .) | quote }}
                  key: dbname
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-opencrane-app" (include "opencrane.postgres.fullname" .) | quote }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-opencrane-app" (include "opencrane.postgres.fullname" .) | quote }}
                  key: password
            - name: PGSSLMODE
              value: disable
            - name: OPENCRANE_MIGRATION_SOURCE_VERSION
              value: {{ .Values.migration.sourceVersion | quote }}
            - name: OPENCRANE_MIGRATION_SILO_ID
              value: {{ .Values.migration.siloId | quote }}
            - name: OPENCRANE_MIGRATION_OIDC_ISSUER
              value: {{ .Values.migration.oidcIssuer | quote }}
            - name: TMPDIR
              value: /scratch
          volumeMounts:
            - name: scratch
              mountPath: /scratch
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
