{{- if .Values.privileges.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "opencrane.postgres.fullname" . }}-database-privileges
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    {{- include "opencrane.postgres.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ add .Values.privileges.timeoutSeconds .Values.privileges.jobDeadlineGraceSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "opencrane.postgres.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/part-of: opencrane
        app.kubernetes.io/component: postgres-database-privileges
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      {{- with .Values.privileges.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        {{- range $databaseIndex, $database := .Values.databases }}
        - name: {{ printf "%s-privileges" $database.name | trunc 63 | trimSuffix "-" }}
          image: {{ $.Values.image | quote }}
          resources:
            {{- toYaml $.Values.privileges.resources | nindent 12 }}
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              deadline="$(( $(date +%s) + {{ $.Values.privileges.timeoutSeconds }} ))"
              {{- if eq $databaseIndex 0 }}
              baseline_log="/tmp/${PGDATABASE}-baseline.log"
              until recorded_origin="$(psql --no-psqlrc -v ON_ERROR_STOP=1 -d "$PGDATABASE" -tA \
                -c 'SELECT "baseline_sha256" FROM "opencrane_bootstrap"."target_baseline" WHERE "singleton" = TRUE' \
                2>"$baseline_log")"; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  cat "$baseline_log" >&2
                  echo "Timed out proving schema convergence for logical database '$PGDATABASE'" >&2
                  exit 1
                fi
                sleep 2
              done
              convergence=incompatible
              if [ "$recorded_origin" = "$CURRENT_PROTECTED_BASELINE_SHA256" ]; then
                history_exists="$(psql --no-psqlrc -v ON_ERROR_STOP=1 -d "$PGDATABASE" -tA \
                  -c "SELECT to_regclass('opencrane_migrations.schema_history') IS NOT NULL")"
                [ "$history_exists" = "f" ] && convergence=current
              elif [ "$PREVIOUS_MIGRATION_AVAILABLE" = "true" ] \
                && [ "$recorded_origin" = "$SELECTED_SOURCE_PROTECTED_BASELINE_SHA256" ]; then
                history_exists="$(psql --no-psqlrc -v ON_ERROR_STOP=1 -d "$PGDATABASE" -tA \
                  -c "SELECT to_regclass('opencrane_migrations.schema_history') IS NOT NULL")"
                if [ "$history_exists" = "t" ]; then
                  exact_history="$(psql --no-psqlrc -v ON_ERROR_STOP=1 -d "$PGDATABASE" -tA \
                    -v current_schema_version="$CURRENT_SCHEMA_VERSION" \
                    -v target_baseline_sha256="$TARGET_BASELINE_SHA256" \
                    -v previous_migration_id="$PREVIOUS_MIGRATION_ID" \
                    -v previous_migration_sql_sha256="$PREVIOUS_MIGRATION_SQL_SHA256" \
                    -v previous_schema_version="$PREVIOUS_SCHEMA_VERSION" \
                    -v selected_source_protected_baseline_sha256="$SELECTED_SOURCE_PROTECTED_BASELINE_SHA256" \
                    -c "SELECT count(*) = 1 FROM opencrane_migrations.schema_history WHERE schema_version = :'current_schema_version' AND source_schema_version = :'previous_schema_version' AND source_baseline_sha256 = :'selected_source_protected_baseline_sha256' AND target_baseline_sha256 = :'target_baseline_sha256' AND migration_id = :'previous_migration_id' AND sql_sha256 = :'previous_migration_sql_sha256'")"
                  [ "$exact_history" = "t" ] && convergence=current
                fi
              fi
              if [ "$convergence" != "current" ]; then
                cat "$baseline_log" >&2
                echo "Database '$PGDATABASE' is not an exact fresh or migrated $CURRENT_SCHEMA_VERSION schema" >&2
                exit 1
              fi
              {{- end }}
              privileges_log="/tmp/${PGDATABASE}-privileges.log"
              until psql --single-transaction -v ON_ERROR_STOP=1 -d "$PGDATABASE" -v database="$PGDATABASE" -v owner="$PGUSER" -v database_admin="{{ $.Values.databaseAdmin.name }}" >"$privileges_log" 2>&1 <<'SQL'
              REVOKE CONNECT, TEMPORARY ON DATABASE :"database" FROM PUBLIC;
              GRANT CONNECT, TEMPORARY ON DATABASE :"database" TO :"owner";
              GRANT CONNECT, TEMPORARY ON DATABASE :"database" TO :"database_admin";
              SQL
              do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  cat "$privileges_log" >&2
                  echo "Timed out applying privileges for logical database '$PGDATABASE'" >&2
                  exit 1
                fi
                sleep 2
              done
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ $database.credentialsSecret | quote }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $database.credentialsSecret | quote }}
                  key: password
            - name: PGHOST
              value: {{ printf "%s-rw" (include "opencrane.postgres.fullname" $) | quote }}
            - name: PGDATABASE
              value: {{ $database.name | quote }}
            {{- if eq $databaseIndex 0 }}
            - name: CURRENT_SCHEMA_VERSION
              value: {{ $.Values.convergence.targetSchemaVersion | quote }}
            - name: TARGET_BASELINE_SHA256
              value: {{ $.Values.convergence.targetBaselineSha256 | quote }}
            - name: CURRENT_PROTECTED_BASELINE_SHA256
              value: {{ $.Values.convergence.currentProtectedBaselineSha256 | quote }}
            - name: PREVIOUS_MIGRATION_AVAILABLE
              value: {{ $.Values.convergence.previousMigration.available | quote }}
            - name: PREVIOUS_MIGRATION_ID
              value: {{ $.Values.convergence.previousMigration.id | quote }}
            - name: PREVIOUS_MIGRATION_SQL_SHA256
              value: {{ $.Values.convergence.previousMigration.sqlSha256 | quote }}
            - name: PREVIOUS_SCHEMA_VERSION
              value: {{ $.Values.convergence.previousMigration.fromSchemaVersion | quote }}
            - name: SELECTED_SOURCE_PROTECTED_BASELINE_SHA256
              value: {{ $.Values.convergence.previousMigration.selectedSourceProtectedBaselineSha256 | quote }}
            {{- end }}
        {{- end }}
{{- end }}
