{{- $poolerName := printf "%s-pooler" (include "opencrane.postgres.fullname" .) | trunc 63 | trimSuffix "-" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-client" $poolerName | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "opencrane.postgres.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-pooler-client
spec:
  # Headless DNS returns the selected Pooler Pod addresses. This avoids a GKE
  # Dataplane V2 ClusterIP path that cannot be authorised by a Pod-only policy,
  # while clients still use one stable DNS name and cannot bypass PgBouncer.
  clusterIP: None
  ports:
    - name: postgresql
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    cnpg.io/poolerName: {{ $poolerName }}
