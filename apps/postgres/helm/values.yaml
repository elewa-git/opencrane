instances: 1
image: ghcr.io/cloudnative-pg/postgresql:17.5

# One physical CNPG Cluster hosts these isolated logical databases. The first item is
# bootstrapped by CNPG initdb; each later item becomes a CNPG Database CR and a managed
# PostgreSQL role. Every item must use its own basic-auth Secret (username/password).
databases:
  - name: opencrane
    owner: opencrane
    credentialsSecret: ""
  - name: obot
    owner: obot
    credentialsSecret: ""
  - name: litellm
    owner: litellm
    credentialsSecret: ""
  - name: langfuse
    owner: langfuse
    credentialsSecret: ""

storage:
  size: 20Gi
  storageClass: ""
  resizeInUseVolumes: true

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

networkPolicy:
  enabled: true
  # CloudNativePG's operator must reach the instance-manager status endpoint on port 8000.
  operatorNamespace: cnpg-system
  operatorPodLabels:
    app.kubernetes.io/name: cloudnative-pg
  # All database clients in this ClusterTenant namespace. PostgreSQL roles and
  # per-database credentials, not NetworkPolicy, enforce logical-database isolation.
  clientPodSelectors:
    - matchLabels:
        app.kubernetes.io/component: opencrane-server
    - matchLabels:
        app.kubernetes.io/component: opencrane-server-migrate
    - matchLabels:
        app.kubernetes.io/component: postgres-database-privileges

privileges:
  # A bounded in-cluster psql Job runs after each Cluster/Database reconciliation to
  # remove PostgreSQL's default PUBLIC CONNECT/TEMPORARY grants from every logical DB.
  timeoutSeconds: 300

backup:
  # This is the infrastructure contract that Phase F/#224's ClusterTenant policy
  # reconciles into. It deliberately has no UI or product API here.
  enabled: false
  # A bounded cadence makes retainedCopies convertible to the Barman ObjectStore
  # recovery-window policy: daily => Nd, weekly => Nw, monthly => Nm.
  frequency: daily
  retainedCopies: 7
  immediate: false
  # The Barman Cloud CNPG-I ObjectStore is app-owned when backups are enabled.
  # Configuration contains references to pre-created credential Secrets; it never
  # contains credential values. destinationPath must be unique per ClusterTenant.
  objectStore:
    name: ""
    configuration: {}
    instanceSidecarConfiguration: {}

restore:
  enabled: false
  sourceName: source
  targetTime: ""
  plugin:
    name: ""
    parameters: {}
