{{- $v := .Values.toolRunner -}}
{{- if or (gt (len $v.namespace) 63) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $v.namespace)) (eq $v.namespace .Release.Namespace) -}}
{{- fail "toolRunner.namespace must be a valid namespace distinct from the server" -}}
{{- end -}}
{{- if ne $v.serviceAccountName "tool-runner-default" -}}
{{- fail "toolRunner.serviceAccountName must be the exact tool-runner-default identity" -}}
{{- end -}}
{{- if not (regexMatch "^([1-9]|10)$" (toString $v.quota.pods)) -}}
{{- fail "toolRunner.quota.pods must be between 1 and 10" -}}
{{- end -}}
{{- if not (regexMatch "^([1-9]|10)$" (toString $v.quota.jobs)) -}}
{{- fail "toolRunner.quota.jobs must be between 1 and 10" -}}
{{- end -}}
{{- if not (regexMatch "^([1-9][0-9]?[0-9]?m|1|2)$" (toString $v.quota.cpu)) -}}
{{- fail "toolRunner.quota.cpu must be positive and no greater than 2 cores" -}}
{{- end -}}
{{- if not (regexMatch "^([1-9][0-9]?[0-9]?Mi|1Gi|2Gi)$" (toString $v.quota.memory)) -}}
{{- fail "toolRunner.quota.memory must be positive and no greater than 2Gi" -}}
{{- end -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $v.namespace }}
  labels:
    app.kubernetes.io/part-of: opencrane
    app.kubernetes.io/component: tool-runner
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $v.serviceAccountName }}
  namespace: {{ $v.namespace }}
  labels:
    app.kubernetes.io/part-of: opencrane
    app.kubernetes.io/component: tool-runner
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tool-runner-jobs
  namespace: {{ $v.namespace }}
spec:
  hard:
    pods: {{ $v.quota.pods | quote }}
    count/jobs.batch: {{ $v.quota.jobs | quote }}
    requests.cpu: {{ $v.quota.cpu | quote }}
    requests.memory: {{ $v.quota.memory | quote }}
    limits.cpu: {{ $v.quota.cpu | quote }}
    limits.memory: {{ $v.quota.memory | quote }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tool-runner-default-deny
  namespace: {{ $v.namespace }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
