l-view-box=\"0 0 10 9\"><polygon points=\"5,0 10,9 0,9\" fill=\"#0db5cc\" opacity=\".6\"><\u002Fpolygon><\u002Fsvg>Manage projects<\u002Fspan>\n                  <span style=\"position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:linear-gradient(135deg,#fff 0%,#fff 50%,#eefafc 50%);border:1px solid #9fdde8;border-radius:9px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;flex-shrink:0;box-shadow:0 2px 0 #cdeef3,0 3px 6px rgba(13,181,204,.12)\"><span style=\"position:absolute;top:0;right:0;width:11px;height:11px;background:linear-gradient(225deg,#fbfcfc 0%,#fbfcfc 50%,#9fdde8 50%,#d4f0f5 100%);border-bottom-left-radius:3px;box-shadow:-1px 1px 1.5px rgba(0,0,0,.07)\"><\u002Fspan><svg width=\"10\" height=\"9\" sc-camel-view-box=\"0 0 10 9\"><polygon points=\"5,0 10,9 0,9\" fill=\"#0db5cc\"><\u002Fpolygon><\u002Fsvg>Research through project files<\u002Fspan>\n                  <span style=\"display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:#fff;border:1px solid #dee3e4;border-radius:9px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;flex-shrink:0;box-shadow:0 1px 0 #e6eaeb;transition:all .13s ease\" style-hover=\"background:linear-gradient(135deg,#fff 0%,#fff 50%,#eefafc 50%);border-color:#9fdde8;box-shadow:0 2px 0 #cdeef3,0 3px 6px rgba(13,181,204,.12);transform:translateY(-1px)\"><svg width=\"10\" height=\"9\" sc-camel-view-box=\"0 0 10 9\"><polygon points=\"5,0 10,9 0,9\" fill=\"#0db5cc\" opacity=\".6\"><\u002Fpolygon><\u002Fsvg>Automate workflows<\u002Fspan>\n                  <span style=\"display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:#fff;border:1px solid #dee3e4;border-radius:9px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;flex-shrink:0;box-shadow:0 1px 0 #e6eaeb;transition:all .13s ease\" style-hover=\"background:linear-gradient(135deg,#fff 0%,#fff 50%,#eefafc 50%);border-color:#9fdde8;box-shadow:0 2px 0 #cdeef3,0 3px 6px rgba(13,181,204,.12);transform:translateY(-1px)\"><svg width=\"10\" height=\"9\" sc-camel-view-box=\"0 0 10 9\"><polygon points=\"5,0 10,9 0,9\" fill=\"#0db5cc\" opacity=\".6\"><\u002Fpolygon><\u002Fsvg>Research the web<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;justify-content:flex-end;margin-bottom:28px\">\n                <div style=\"background:#eef1f2;color:#16191a;border:1px solid #e6eaeb;border-radius:14px 14px 3px 14px;padding:11px 16px;font-size:14.5px;line-height:1.6;max-width:72%;box-shadow:0 1px 0 rgba(255,255,255,.7) inset\">Research through project files<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"margin-bottom:32px\">\n                <div style=\"font-size:15px;line-height:1.7;margin-bottom:12px\">Then one last thing and we can start. When I work on something for you, how much rope do I get?<\u002Fdiv>\n                <div style=\"display:flex;gap:8px;overflow-x:auto;padding-bottom:14px\">\n                  <span style=\"display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:#fff;border:1px solid #dee3e4;border-radius:9px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;flex-shrink:0;box-shadow:0 1px 0 #e6eaeb;transition:all .13s ease;animation:oc-deal .38s cubic-bezier(.32,.72,0,1) .5s backwards\" style-hover=\"background:linear-gradient(135deg,#fff 0%,#fff 50%,#eefafc 50%);border-color:#9fdde8;box-shadow:0 2px 0 #cdeef3,0 3px 6px rgba(13,181,204,.12);transform:translateY(-1px)\"><svg width=\"10\" height=\"9\" sc-camel-view-box=\"0 0 10 9\"><polygon points=\"5,0 10,9 0,9\" fill=\"#0db5cc\" opacity=\".6\"><\u002Fpolygon><\u002Fsvg>Ask before you act<\u002Fspan>\n                  <span style=\"display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:#fff;border:1px solid #dee3e4;border-radius:9px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;flex-shrink:0;box-shadow:0 1px 0 #e6eaeb;transition:all .13s ease;animation:oc-deal .38s cubic-bezier(.32,.72,0,1) .534s backwards\" style-hover=\"background:linear-gradient(135deg,#fff 0%,#fff 50%,#eefafc 50%);border-color:#9fdde8;box-shadow:0 2px 0 #cdeef3,0 3px 6px rgba(13,181,204,.12);transform:translateY(-1px)\"><svg width=\"10\" height=\"9\" sc-camel-view-box=\"0 0 10 9\"><polygon points=\"5,0 10,9 0,9\" fill=\"#0db5cc\" opacity=\".6\"><\u002Fpolygon><\u002Fsvg>Draft it, I will edit<\u002Fspan>\n                  <span style=\"display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:#fff;border:1px solid #dee3e4;border-radius:9px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;flex-shrink:0;box-shadow:0 1px 0 #e6eaeb;transition:all .13s ease;animation:oc-deal .38s cubic-bezier(.32,.72,0,1) .568s backwards\" style-hover=\"background:linear-gradient(135deg,#fff 0%,#fff 50%,#eefafc 50%);border-color:#9fdde8;box-shadow:0 2px 0 #cdeef3,0 3px 6px rgba(13,181,204,.12);transform:translateY(-1px)\"><svg width=\"10\" height=\"9\" sc-camel-view-box=\"0 0 10 9\"><polygon points=\"5,0 10,9 0,9\" fill=\"#0db5cc\" opacity=\".6\"><\u002Fpolygon><\u002Fsvg>Just do it, show me after<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:13.5px;color:#81888a;line-height:1.6\">Or tell me in your own words — I will keep asking small questions like this as we work, and keep notes you can always see, edit or delete.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;align-items:center;gap:12px\">\n                <span style=\"display:inline-flex;align-items:flex-end;perspective:200px\">\n                  <span style=\"width:11px;height:9px;flex-shrink:0;opacity:.45;clip-path:polygon(50% 0,100% 100%,0 100%);background:#0db5cc;transform-origin:50% 100%;animation:ocFold 1.6s ease-in-out infinite\"><\u002Fspan>\n                  <span style=\"width:11px;height:9px;flex-shrink:0;opacity:.45;margin-left:-4px;clip-path:polygon(0 0,100% 0,50% 100%);background:#22c7dd;transform-origin:50% 0%;animation:ocFold 1.6s ease-in-out .16s infinite\"><\u002Fspan>\n                  <span style=\"width:11px;height:9px;flex-shrink:0;opacity:.45;margin-left:-4px;clip-path:polygon(50% 0,100% 100%,0 100%);background:#0d8ba0;transform-origin:50% 100%;animation:ocFold 1.6s ease-in-out .32s infinite\"><\u002Fspan>\n                  <span style=\"width:11px;height:9px;flex-shrink:0;opacity:.45;margin-left:-4px;clip-path:polygon(0 0,100% 0,50% 100%);background:#66d7e6;transform-origin:50% 0%;animation:ocFold 1.6s ease-in-out .48s infinite\"><\u002Fspan>\n                  <span style=\"width:11px;height:9px;flex-shrink:0;opacity:.45;margin-left:-4px;clip-path:polygon(50% 0,100% 100%,0 100%);background:#f47920;transform-origin:50% 100%;animation:ocFold 1.6s ease-in-out .64s infinite\"><\u002Fspan>\n                <\u002Fspan>\n                <span style=\"font-size:12.5px;color:#a7aeaf;font-style:italic\">Folding…<\u002Fspan>\n              <\u002Fdiv>\n\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:0 24px 22px;flex-shrink:0\">\n            <div style=\"max-width:700px;margin:0 auto\">\n              <div style=\"background:#fff;border:1px solid #d3d9da;border-radius:10px;padding:13px 15px\">\n                <span style=\"font-size:14.5px;color:#a7aeaf\">Message this session…<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:6px;margin-top:9px\">\n                <span style=\"padding:4px;color:#81888a;display:inline-flex;border-radius:5px\">\n                  <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M8 3v10M3 8h10\"><\u002Fpath><\u002Fsvg>\n                <\u002Fspan>\n                <span style=\"padding:4px;color:#81888a;display:inline-flex;border-radius:5px\">\n                  <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"2\" width=\"4\" height=\"7\" rx=\"2\"><\u002Frect><path d=\"M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2\"><\u002Fpath><\u002Fsvg>\n                <\u002Fspan>\n                <span style=\"flex:1\"><\u002Fspan>\n                <span style=\"background:#0db5cc;border-radius:7px;padding:6px 9px;display:inline-flex;box-shadow:0 1px 0 #0a94a7\">\n                  <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 7H2M8 3l4 4-4 4\"><\u002Fpath><\u002Fsvg>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:1080px;font:400 11.5px/1.55 'DM Sans',sans-serif;color:#81888a;border-left:2px solid #cfe8ee;padding-left:10px\">Spacing per the system mock: 32px after an assistant turn, 28px after a user bubble, 12px between prose and its cards. Option cards are the mock's carousel chips — 9px radius, teal facet, diagonal-fold hover; the chosen one keeps the fold as a dog-ear. Citation strip and selected chip carry a folded paper corner; the agent is mid-reply below, facets folding in sequence.<\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n  <p style=\"margin:24px 0 0;font:12px/1.5 'DM Sans',sans-serif;color:rgba(0,0,0,.5)\">Try next: \"carry this button style back into <a href=\"#1i\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">1i<\u002Fa>\" · \"show the agent working after the last answer\" · \"add a typing state\"<\u002Fp>\n<\u002Fsection>\n\n<section id=\"t4\" style=\"padding:40px 44px 36px;border-bottom:1px solid rgba(0,0,0,.08)\">\n  <div style=\"display:flex;align-items:baseline;gap:10px;margin:0 0 6px\">\n    <a href=\"#t4\" style=\"font:600 10px 'DM Mono',monospace;padding:3px 7px;background:#16191a;color:#fff;border-radius:4px;text-decoration:none\">4<\u002Fa>\n    <span style=\"font:600 13px/1.2 'DM Sans',sans-serif;color:#16191a\">Tool calling — one message, many calls<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"font:400 12.5px/1.5 'DM Sans',sans-serif;color:#81888a;margin:0 0 26px;max-width:760px\">Tool use is quiet: each call is a single light line between the prose, in plain words. Detail exists but only behind a click — nothing technical is in the way.<\u002Fp>\n  <div style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start\">\n\n    <div id=\"4a\" style=\"flex:none;display:flex;flex-direction:column;gap:9px\">\n      <div style=\"display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'DM Sans',sans-serif;color:rgba(0,0,0,.55)\"><a href=\"#4a\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">4a<\u002Fa>Mid-run — plain lines, one opened<\u002Fdiv>\n      <div style-before=\"content:'';position:absolute;inset:0;background-image:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27140%27%20height=%27140%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%27.82%27%20numOctaves=%273%27%20stitchTiles=%27stitch%27/%3E%3CfeColorMatrix%20type=%27saturate%27%20values=%270%27/%3E%3C/filter%3E%3Crect%20width=%27140%27%20height=%27140%27%20filter=%27url%28%23n%29%27%20opacity=%27.42%27/%3E%3C/svg%3E);opacity:.075;pointer-events:none;border-radius:inherit\" style=\"position:relative;width:700px;background:#fbfcfc;border:1px solid #d9dfe0;border-radius:11px;padding:26px 28px\">\n        <div style=\"font-size:15px;line-height:1.7;margin-bottom:10px\">Let me check what Vermeulen actually charges before we quote.<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:7px;padding:4px 0;font-size:13px;color:#81888a;cursor:pointer;transition:color .14s ease\" style-hover=\"color:#16191a\">Searched company knowledge · <span style=\"color:#616a6c\">7 results<\u002Fspan><svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 10 10\" fill=\"none\" stroke=\"#a7aeaf\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M3.5 2l3 3-3 3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:7px;padding:4px 0;font-size:13px;color:#81888a;cursor:pointer;transition:color .14s ease\" style-hover=\"color:#16191a\">Read <span style=\"color:#616a6c\">call-notes-4-jun.md<\u002Fspan><svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 10 10\" fill=\"none\" stroke=\"#a7aeaf\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M3.5 2l3 3-3 3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"padding:4px 0;font-size:13px;color:#81888a;cursor:pointer\"><span style=\"display:flex;align-items:center;gap:7px\"><span>Could not read the invoices — <span style=\"color:#9a6b2a\">continuing without them<\u002Fspan><\u002Fspan><svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 10 10\" fill=\"none\" stroke=\"#a7aeaf\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M2 3.5l3 3 3-3\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div style=\"margin:7px 0 4px;background:#f7f9f9;border:1px solid #e6eaeb;border-radius:8px;padding:9px 12px;font-size:12px;line-height:1.55;color:#81888a;cursor:default\">The invoice connection does not have permission to read invoices, so totals below are unchecked. <span style=\"font-family:'DM Mono',monospace;font-size:10.5px;color:#a7aeaf\">odoo · 403<\u002Fspan><div style=\"margin-top:7px;display:flex;gap:12px\"><span style=\"color:#2f8d9a;font-weight:500;cursor:pointer\">Fix access<\u002Fspan><span style=\"color:#2f8d9a;font-weight:500;cursor:pointer\">Try again<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;padding:6px 0 0;font-size:13px;color:#a7aeaf;font-style:italic\">\n          <span style=\"display:inline-flex;align-items:flex-end;perspective:200px\">\n            <span style=\"width:10px;height:8px;flex-shrink:0;opacity:.45;clip-path:polygon(50% 0,100% 100%,0 100%);background:#0db5cc;transform-origin:50% 100%;animation:ocFold 1.6s ease-in-out infinite\"><\u002Fspan>\n            <span style=\"width:10px;height:8px;flex-shrink:0;opacity:.45;margin-left:-4px;clip-path:polygon(0 0,100% 0,50% 100%);background:#22c7dd;transform-origin:50% 0%;animation:ocFold 1.6s ease-in-out .16s infinite\"><\u002Fspan>\n            <span style=\"width:10px;height:8px;flex-shrink:0;opacity:.45;margin-left:-4px;clip-path:polygon(50% 0,100% 100%,0 100%);background:#66d7e6;transform-origin:50% 100%;animation:ocFold 1.6s ease-in-out .32s infinite\"><\u002Fspan>\n          <\u002Fspan>\n          Comparing the three retainers…\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:700px;font:400 11.5px/1.55 'DM Sans',sans-serif;color:#81888a;border-left:2px solid #cfe8ee;padding-left:10px\">Each call is one grey line in plain words — what it did, not which API it used. The only open detail is the problem, and even that explains itself in a sentence with the mechanics reduced to a small mono footnote. The running step folds quietly.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"4b\" style=\"flex:none;display:flex;flex-direction:column;gap:9px\">\n      <div style=\"display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'DM Sans',sans-serif;color:rgba(0,0,0,.55)\"><a href=\"#4b\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">4b<\u002Fa>Finished — one line above the answer<\u002Fdiv>\n      <div style-before=\"content:'';position:absolute;inset:0;background-image:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27140%27%20height=%27140%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%27.82%27%20numOctaves=%273%27%20stitchTiles=%27stitch%27/%3E%3CfeColorMatrix%20type=%27saturate%27%20values=%270%27/%3E%3C/filter%3E%3Crect%20width=%27140%27%20height=%27140%27%20filter=%27url%28%23n%29%27%20opacity=%27.42%27/%3E%3C/svg%3E);opacity:.075;pointer-events:none;border-radius:inherit\" style=\"position:relative;width:520px;background:#fbfcfc;border:1px solid #d9dfe0;border-radius:11px;padding:26px 28px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;align-items:center;gap:7px;font-size:13px;color:#81888a;cursor:pointer;transition:color .14s ease\" style-hover=\"color:#16191a\">Checked 5 sources · <span style=\"color:#9a6b2a\">1 unavailable<\u002Fspan><svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 10 10\" fill=\"none\" stroke=\"#a7aeaf\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M3.5 2l3 3-3 3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.7\">Vermeulen bills per deliverable, so their headline rate is not comparable to ours. On the three retainers I could read, their effective monthly cost is 12% higher than the Nova quote.<\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e6eaeb;border-left:3px solid #2a5c9a;border-radius:6px;padding:9px 12px;display:flex;align-items:center;gap:10px\">\n          <span style=\"font-size:10px;font-weight:600;background:#ddeeff;color:#2a5c9a;padding:2px 6px;border-radius:3px;font-family:'DM Mono',monospace\">R1<\u002Fspan>\n          <span style=\"font-size:13.5px;flex:1\">Retainer terms, 4 Jun call<\u002Fspan>\n          <span style=\"font-size:10px;background:#e0f0e8;color:#2a7d4f;padding:2px 6px;border-radius:3px;font-weight:500\">project<\u002Fspan>\n          <span style=\"font-family:'DM Mono',monospace;font-size:11.5px;color:#91989a\">call-notes-4-jun.md<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:520px;font:400 11.5px/1.55 'DM Sans',sans-serif;color:#81888a;border-left:2px solid #cfe8ee;padding-left:10px\">Finished work folds to one grey line above the answer. The one thing that stays visible is that a source was unavailable — never hidden by collapsing.<\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n  <p style=\"margin:24px 0 0;font:12px/1.5 'DM Sans',sans-serif;color:rgba(0,0,0,.5)\">Try next: \"show the approval pause for the queued write in <a href=\"#4a\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">4a<\u002Fa>\" · \"add a parallel-calls variant\" · \"drop this block into the chat screen in context\"<\u002Fp>\n<\u002Fsection>\n\n<section id=\"t3\" style=\"padding:40px 44px 36px;border-bottom:1px solid rgba(0,0,0,.08)\">\n  <div style=\"display:flex;align-items:baseline;gap:10px;margin:0 0 6px\">\n    <a href=\"#t3\" style=\"font:600 10px 'DM Mono',monospace;padding:3px 7px;background:#16191a;color:#fff;border-radius:4px;text-decoration:none\">3<\u002Fa>\n    <span style=\"font:600 13px/1.2 'DM Sans',sans-serif;color:#16191a\">Knowledge storing requests — suggested target, user decides<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"font:400 12.5px/1.5 'DM Sans',sans-serif;color:#81888a;margin:0 0 26px;max-width:760px\">Personal knowledge is stored without asking. Anything that would travel further is a request: the agent names what it learned, suggests a target, and waits. Scope pills are multi-select — one write can land in more than one place.<\u002Fp>\n  <div style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start\">\n\n    <div id=\"3a\" style=\"flex:none;display:flex;flex-direction:column;gap:9px\">\n      <div style=\"display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'DM Sans',sans-serif;color:rgba(0,0,0,.55)\"><a href=\"#3a\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">3a<\u002Fa>Storing request — suggested target, pills adjustable<\u002Fdiv>\n      <div style-before=\"content:'';position:absolute;inset:0;background-image:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27140%27%20height=%27140%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%27.82%27%20numOctaves=%273%27%20stitchTiles=%27stitch%27/%3E%3CfeColorMatrix%20type=%27saturate%27%20values=%270%27/%3E%3C/filter%3E%3Crect%20width=%27140%27%20height=%27140%27%20filter=%27url%28%23n%29%27%20opacity=%27.42%27/%3E%3C/svg%3E);opacity:.075;pointer-events:none;border-radius:inherit\" style=\"position:relative;width:640px;background:#fbfcfc;border:1px solid #d9dfe0;border-radius:11px;padding:26px 28px\">\n        <div style=\"background:#fff;border:1px solid #d9dfe0;border-top:3px solid #0db5cc;border-radius:10px;padding:15px 17px 14px;box-shadow:0 1px 3px rgba(0,0,0,.05)\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:9px\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"width:10px;height:9px;display:inline-block;clip-path:polygon(50% 0,100% 100%,0 100%);background:#0db5cc\"><\u002Fspan>\n              <span style=\"font-size:13.5px;font-weight:600\">Store this where others can use it?<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-family:'DM Mono',monospace;font-size:10.5px;color:#a0a7a8\">learned in this session<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"background:#f7f9f9;border:1px solid #e6eaeb;border-radius:7px;padding:10px 12px;font-size:13.5px;line-height:1.6;margin-bottom:13px\">Vermeulen prices retainers per deliverable, not per month — confirmed in the 4 Jun call notes.<\u002Fdiv>\n          <div style=\"font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#91989a;margin-bottom:8px\">Store in<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px\">\n            <span style=\"display:inline-flex;align-items:center;gap:6px;border-radius:4px;padding:5px 10px 5px 8px;font-size:12px;background:#fce8e4;color:#c1392b;border:1px solid #f0c9c2;cursor:pointer\">\n              <svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 10 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 5.2l2 2L8 3\"><\u002Fpath><\u002Fsvg>\n              personal\n            <\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:6px;border-radius:4px;padding:5px 10px 5px 8px;font-size:12px;background:#e0f0e8;color:#2a7d4f;border:1px solid #bfdccd;cursor:pointer\">\n              <svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 10 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 5.2l2 2L8 3\"><\u002Fpath><\u002Fsvg>\n              project · Nova rebrand\n            <\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:6px;border-radius:4px;padding:5px 10px 5px 8px;font-size:12px;background:#fff;color:#616a6c;border:1px solid #c9d0d1;cursor:pointer\">\n              <span style=\"width:7px;height:7px;border-radius:2px;background:#fef0d0;border:1px solid #e3cd9d\"><\u002Fspan>\n              dept · Tech\n            <\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:6px;border-radius:4px;padding:5px 10px 5px 8px;font-size:12px;background:#fff;color:#616a6c;border:1px solid #c9d0d1;cursor:pointer\">\n              <span style=\"width:7px;height:7px;border-radius:2px;background:#e6e9e9;border:1px solid #cfcfc9\"><\u002Fspan>\n              org\n            <\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:5px 10px;font-size:12px;background:transparent;color:#81888a;border:1px dashed #c9d0d1;cursor:pointer\">\n              Another project\n              <svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 10 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M2 4l3 3 3-3\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#81888a;line-height:1.5;margin-bottom:13px\">Suggested <span style=\"color:#2a7d4f;font-weight:500\">project · Nova rebrand<\u002Fspan> — the call notes it came from live there. Department needs an approval from Marieke Vos.<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #ebeff0;padding-top:12px\">\n            <span style=\"font-size:11.5px;color:#91989a\">Denying keeps it in this session only.<\u002Fspan>\n            <div style=\"display:flex;gap:7px\">\n              <span style=\"background:transparent;border:1px solid #c9d0d1;border-radius:6px;padding:7px 14px;font-size:12.5px;display:inline-flex;align-items:center;cursor:pointer\">Deny<\u002Fspan>\n              <span style=\"background:#2f8d9a;color:#fff;border-radius:6px;padding:7px 15px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;cursor:pointer;box-shadow:0 1px 0 #23707b\">Store in 2 places<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:640px;font:400 11.5px/1.55 'DM Sans',sans-serif;color:#81888a;border-left:2px solid #cfe8ee;padding-left:10px\">Selected pills carry the scope colour and a check; unselected ones are neutral with a colour swatch, so the palette does not shout before a choice is made. The primary button counts what was picked.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"3b\" style=\"flex:none;display:flex;flex-direction:column;gap:9px\">\n      <div style=\"display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'DM Sans',sans-serif;color:rgba(0,0,0,.55)\"><a href=\"#3b\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">3b<\u002Fa>Personal — stored without asking<\u002Fdiv>\n      <div style-before=\"content:'';position:absolute;inset:0;background-image:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27140%27%20height=%27140%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%27.82%27%20numOctaves=%273%27%20stitchTiles=%27stitch%27/%3E%3CfeColorMatrix%20type=%27saturate%27%20values=%270%27/%3E%3C/filter%3E%3Crect%20width=%27140%27%20height=%27140%27%20filter=%27url%28%23n%29%27%20opacity=%27.42%27/%3E%3C/svg%3E);opacity:.075;pointer-events:none;border-radius:inherit\" style=\"position:relative;width:420px;background:#fbfcfc;border:1px solid #d9dfe0;border-radius:11px;padding:26px 28px;display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;align-items:center;gap:9px;font-size:12.5px;color:#616a6c\">\n          <span style=\"font-size:11px;padding:3px 9px;border-radius:4px;background:#fce8e4;color:#c1392b;white-space:nowrap\">personal<\u002Fspan>\n          <span style=\"flex:1\">Noted that you prefer answers before reasoning.<\u002Fspan>\n          <span style=\"font-size:11.5px;color:#0a94a7;cursor:pointer\">Undo<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height:1px;background:#e6eaeb\"><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:9px;font-size:12.5px;color:#616a6c\">\n          <span style=\"font-size:11px;padding:3px 9px;border-radius:4px;background:#fce8e4;color:#c1392b;white-space:nowrap\">personal<\u002Fspan>\n          <span style=\"flex:1\">Nova pitch is yours, not the team's.<\u002Fspan>\n          <span style=\"font-size:11.5px;color:#0a94a7;cursor:pointer\">Undo<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:11.5px;color:#91989a;line-height:1.55\">Personal knowledge never asks. It is written as it is learned and listed in Settings, where you can delete any of it.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:420px;font:400 11.5px/1.55 'DM Sans',sans-serif;color:#81888a;border-left:2px solid #cfe8ee;padding-left:10px\">A one-line receipt with an undo, not a decision. The only card that appears is one that would move knowledge off your desk.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"3c\" style=\"flex:none;display:flex;flex-direction:column;gap:9px\">\n      <div style=\"display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'DM Sans',sans-serif;color:rgba(0,0,0,.55)\"><a href=\"#3c\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">3c<\u002Fa>Batched — pending requests in Activity<\u002Fdiv>\n      <div style-before=\"content:'';position:absolute;inset:0;background-image:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27140%27%20height=%27140%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%27.82%27%20numOctaves=%273%27%20stitchTiles=%27stitch%27/%3E%3CfeColorMatrix%20type=%27saturate%27%20values=%270%27/%3E%3C/filter%3E%3Crect%20width=%27140%27%20height=%27140%27%20filter=%27url%28%23n%29%27%20opacity=%27.42%27/%3E%3C/svg%3E);opacity:.075;pointer-events:none;border-radius:inherit\" style=\"position:relative;width:560px;background:#fbfcfc;border:1px solid #d9dfe0;border-radius:11px;padding:24px 26px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px\">\n          <span style=\"font-size:20px;font-weight:600;letter-spacing:-.4px\">Knowledge to file<\u002Fspan>\n          <span style=\"font-size:12px;color:#81888a\">3 waiting<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;color:#81888a;margin-bottom:18px\">Decide in one pass, or open a session to see the context.<\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #d9dfe0;border-radius:10px;overflow:hidden\">\n          <div style=\"padding:12px 14px;border-bottom:1px solid #ebeff0;display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font-size:13.5px;line-height:1.5\">Vermeulen prices retainers per deliverable<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:7px\">\n              <span style=\"display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:4px 9px;font-size:11.5px;background:#e0f0e8;color:#2a7d4f;border:1px solid #bfdccd\">\n                <svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 10 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 5.2l2 2L8 3\"><\u002Fpath><\u002Fsvg>\n                project\n              <\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:4px 9px;font-size:11.5px;background:#fff;color:#616a6c;border:1px solid #c9d0d1\"><span style=\"width:6px;height:6px;border-radius:2px;background:#fef0d0;border:1px solid #e3cd9d\"><\u002Fspan>dept<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-size:12px;color:#81888a;cursor:pointer\">Deny<\u002Fspan>\n              <span style=\"font-size:12px;color:#0a94a7;font-weight:500;cursor:pointer\">Store<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:12px 14px;border-bottom:1px solid #ebeff0;display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font-size:13.5px;line-height:1.5\">Pod migration window moved to 14 Sep<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:7px\">\n              <span style=\"display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:4px 9px;font-size:11.5px;background:#fef0d0;color:#9a6b2a;border:1px solid #e3cd9d\">\n                <svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 10 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 5.2l2 2L8 3\"><\u002Fpath><\u002Fsvg>\n                dept · Tech\n              <\u002Fspan>\n              <span style=\"font-size:11px;color:#9a6b2a\">needs approval<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-size:12px;color:#81888a;cursor:pointer\">Deny<\u002Fspan>\n              <span style=\"font-size:12px;color:#0a94a7;font-weight:500;cursor:pointer\">Request<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font-size:13.5px;line-height:1.5\">Elewa invoice terms are 30 days net<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:7px\">\n              <span style=\"display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:4px 9px;font-size:11.5px;background:#e6e9e9;color:#454d4f;border:1px solid #d5d5cf\">\n                <svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 10 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 5.2l2 2L8 3\"><\u002Fpath><\u002Fsvg>\n                org\n              <\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-size:12px;color:#81888a;cursor:pointer\">Deny<\u002Fspan>\n              <span style=\"font-size:12px;color:#0a94a7;font-weight:500;cursor:pointer\">Request<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:560px;font:400 11.5px/1.55 'DM Sans',sans-serif;color:#81888a;border-left:2px solid #cfe8ee;padding-left:10px\">Same pills, one row each. Use when requests would otherwise interrupt — the card in <a href=\"#3a\" style=\"font:600 10.5px 'DM Mono',monospace;padding:2px 6px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">3a<\u002Fa> then only appears for things worth deciding on the spot.<\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n  <p style=\"margin:24px 0 0;font:12px/1.5 'DM Sans',sans-serif;color:rgba(0,0,0,.5)\">Try next: \"show the approval Marieke sees when a dept store is requested\" · \"put <a href=\"#3a\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">3a<\u002Fa> inside the chat screen in context\" · \"add a denied state with the reason kept\"<\u002Fp>\n<\u002Fsection>\n\n<section id=\"t2\" style=\"padding:40px 44px 36px;border-bottom:1px solid rgba(0,0,0,.08)\">\n  <div style=\"display:flex;align-items:baseline;gap:10px;margin:0 0 6px\">\n    <a href=\"#t2\" style=\"font:600 10px 'DM Mono',monospace;padding:3px 7px;background:#16191a;color:#fff;border-radius:4px;text-decoration:none\">2<\u002Fa>\n    <span style=\"font:600 13px/1.2 'DM Sans',sans-serif;color:#16191a\">Where knowledge lives — three ways to show scope and inheritance<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"font:400 12.5px/1.5 'DM Sans',sans-serif;color:#81888a;margin:0 0 26px;max-width:760px\">Every session inherits org and department knowledge. A project session additionally reads and writes a project scope shared across sessions. A personal session writes only to itself. The open question is whether that ladder is ambient, a panel, or only visible at the moment knowledge is used.<\u002Fp>\n  <div style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start\">\n\n    <div id=\"2a\" style=\"flex:none;display:flex;flex-direction:column;gap:9px\">\n      <div style=\"display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'DM Sans',sans-serif;color:rgba(0,0,0,.55)\"><a href=\"#2a\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">2a<\u002Fa>Ambient — a scope ladder in the session header<\u002Fdiv>\n      <div style-before=\"content:'';position:absolute;inset:0;background-image:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27140%27%20height=%27140%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%27.82%27%20numOctaves=%273%27%20stitchTiles=%27stitch%27/%3E%3CfeColorMatrix%20type=%27saturate%27%20values=%270%27/%3E%3C/filter%3E%3Crect%20width=%27140%27%20height=%27140%27%20filter=%27url%28%23n%29%27%20opacity=%27.42%27/%3E%3C/svg%3E);opacity:.075;pointer-events:none;border-radius:inherit\" style=\"position:relative;position:relative;width:620px;height:430px;background:#fbfcfc;border:1px solid #d9dfe0;border-radius:11px;overflow:hidden;display:flex;flex-direction:column\">\n        <div style=\"height:48px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dee3e4;box-shadow:0 1px 0 rgba(255,255,255,.75);flex-shrink:0\">\n          <div style=\"display:flex;align-items:center;gap:9px\">\n            <span style=\"font-size:15px;font-weight:600;letter-spacing:-.2px\">Nova rebrand — pitch<\u002Fspan>\n            <span style=\"font-size:11.5px;padding:2px 8px;border-radius:4px;background:#e0f0e8;color:#2a7d4f;font-weight:500\">Project<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"display:inline-flex;align-items:center;gap:5px;border:1px solid #d9dfe0;border-radius:5px;padding:3px 8px;background:#fff\">\n            <span style=\"font-size:10.5px;font-family:'DM Mono',monospace;color:#454d4f\">org<\u002Fspan>\n            <span style=\"color:#c6cdce;font-size:10px\">→<\u002Fspan>\n            <span style=\"font-size:10.5px;font-family:'DM Mono',monospace;color:#9a6b2a\">dept<\u002Fspan>\n            <span style=\"color:#c6cdce;font-size:10px\">→<\u002Fspan>\n            <span style=\"font-size:10.5px;font-family:'DM Mono',monospace;color:#2a7d4f;font-weight:500\">project<\u002Fspan>\n            <span style=\"color:#c6cdce;font-size:10px\">→<\u002Fspan>\n            <span style=\"font-size:10.5px;font-family:'DM Mono',monospace;color:#c1392b;font-weight:500\">session<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;padding:16px 20px;position:relative\">\n          <div style=\"font-size:13.5px;color:#81888a;line-height:1.6;max-width:330px\">Conversation continues here. The ladder above is always visible and never blocks — hovering it opens the breakdown.<\u002Fdiv>\n          <div style=\"position:absolute;top:8px;right:20px;width:300px;background:#fff;border:1px solid #d9dfe0;border-radius:11px;box-shadow:0 2px 3px rgba(0,0,0,.08);padding:6px 0 8px\">\n            <div style=\"padding:8px 13px 6px;font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#91989a\">Reads from<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;padding:7px 13px\">\n              <span style=\"font-size:10px;font-family:'DM Mono',monospace;background:#e6e9e9;color:#454d4f;padding:2px 6px;border-radius:3px\">org<\u002Fspan>\n              <span style=\"font-size:13px;flex:1\">Elewa policies, brand<\u002Fspan>\n              <span style=\"font-size:11px;color:#91989a\">inherited<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;padding:7px 13px\">\n              <span style=\"font-size:10px;font-family:'DM Mono',monospace;background:#fef0d0;color:#9a6b2a;padding:2px 6px;border-radius:3px\">dept<\u002Fspan>\n              <span style=\"font-size:13px;flex:1\">Tech — 214 documents<\u002Fspan>\n              <span style=\"font-size:11px;color:#91989a\">inherited<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;padding:7px 13px;background:#f1f4f5\">\n              <span style=\"font-size:10px;font-family:'DM Mono',monospace;background:#e0f0e8;color:#2a7d4f;padding:2px 6px;border-radius:3px\">proj<\u002Fspan>\n              <span style=\"font-size:13px;flex:1\">Nova rebrand — 38 items<\u002Fspan>\n              <span style=\"font-size:11px;color:#0a94a7\">6 sessions<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;padding:7px 13px\">\n              <span style=\"font-size:10px;font-family:'DM Mono',monospace;background:#fce8e4;color:#c1392b;padding:2px 6px;border-radius:3px\">sess<\u002Fspan>\n              <span style=\"font-size:13px;flex:1\">This session — 3 notes<\u002Fspan>\n              <span style=\"font-size:11px;color:#91989a\">private<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:1px;background:#e6eaeb;margin:6px 13px\"><\u002Fdiv>\n            <div style=\"padding:2px 13px;font-size:11.5px;color:#81888a;line-height:1.5\">Writes land in the session. Promote them to the project to share across all six.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:620px;font:400 11.5px/1.55 'DM Sans',sans-serif;color:#81888a;border-left:2px solid #cfe8ee;padding-left:10px\">Cheapest to build and always truthful. A personal session simply shows <span style=\"font-family:'DM Mono',monospace\">org → dept → session<\u002Fspan> with no project rung.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"2b\" style=\"flex:none;display:flex;flex-direction:column;gap:9px\">\n      <div style=\"display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'DM Sans',sans-serif;color:rgba(0,0,0,.55)\"><a href=\"#2b\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">2b<\u002Fa>Explicit — a knowledge panel with promotion<\u002Fdiv>\n      <div style=\"width:360px;height:470px;background:#eef1f2;border:1px solid #d9dfe0;border-radius:11px;overflow:hidden;display:flex;flex-direction:column\">\n        <div style=\"height:44px;padding:0 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #d9dfe0;flex-shrink:0\">\n          <span style=\"font-size:13px;font-weight:600\">Knowledge<\u002Fspan>\n          <span style=\"font-size:11.5px;color:#81888a\">Nova rebrand<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:14px\">\n          <div>\n            <div style=\"font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#91989a;margin-bottom:7px\">Inherited — read only<\u002Fdiv>\n            <div style=\"background:#fbfcfc;border:1px solid #e6eaeb;border-radius:9px;padding:9px 11px;display:flex;flex-direction:column;gap:7px\">\n              <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-size:10px;font-family:'DM Mono',monospace;background:#e6e9e9;color:#454d4f;padding:2px 6px;border-radius:3px\">org<\u002Fspan><span style=\"font-size:13px;flex:1\">Elewa Group<\u002Fspan><span style=\"font-size:11.5px;color:#91989a\">1,204<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-size:10px;font-family:'DM Mono',monospace;background:#fef0d0;color:#9a6b2a;padding:2px 6px;border-radius:3px\">dept<\u002Fspan><span style=\"font-size:13px;flex:1\">Tech<\u002Fspan><span style=\"font-size:11.5px;color:#91989a\">214<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#91989a;margin-bottom:7px\">Project — shared<\u002Fdiv>\n            <div style=\"background:#fbfcfc;border:1px solid #e6eaeb;border-radius:9px;padding:9px 11px\">\n              <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:5px\"><span style=\"font-size:10px;font-family:'DM Mono',monospace;background:#e0f0e8;color:#2a7d4f;padding:2px 6px;border-radius:3px\">proj<\u002Fspan><span style=\"font-size:13px;flex:1\">Nova rebrand<\u002Fspan><span style=\"font-size:11.5px;color:#91989a\">38<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#81888a;line-height:1.5\">Read and written by 6 sessions. Anything here is visible to everyone on the project.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#91989a;margin-bottom:7px\">This session — private<\u002Fdiv>\n            <div style=\"background:#fbfcfc;border:1px solid #e6eaeb;border-radius:9px;padding:5px 0\">\n              <div style=\"display:flex;align-items:center;gap:8px;padding:7px 11px\"><span style=\"font-size:13px;flex:1\">Pitch angle — \"quiet authority\"<\u002Fspan><span style=\"font-size:11.5px;color:#0a94a7;font-weight:500\">Promote<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:8px;padding:7px 11px;border-top:1px solid #ebeff0\"><span style=\"font-size:13px;flex:1\">Budget ceiling €14,500<\u002Fspan><span style=\"font-size:11.5px;color:#0a94a7;font-weight:500\">Promote<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:8px;padding:7px 11px;border-top:1px solid #ebeff0\"><span style=\"font-size:13px;flex:1\">Competitor note — Vermeulen<\u002Fspan><span style=\"font-size:11.5px;color:#0a94a7;font-weight:500\">Promote<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:11px 16px;border-top:1px solid #d9dfe0;font-size:11.5px;color:#81888a;line-height:1.5\">Promotion only goes up one rung, and to the department it needs an approval.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:360px;font:400 11.5px/1.55 'DM Sans',sans-serif;color:#81888a;border-left:2px solid #cfe8ee;padding-left:10px\">Makes the ladder editable rather than only legible. Costs a rail — pairs with <a href=\"#2a\" style=\"font:600 10.5px 'DM Mono',monospace;padding:2px 6px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">2a<\u002Fa> rather than replacing it.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"2c\" style=\"flex:none;display:flex;flex-direction:column;gap:9px\">\n      <div style=\"display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'DM Sans',sans-serif;color:rgba(0,0,0,.55)\"><a href=\"#2c\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">2c<\u002Fa>At the point of use — provenance, then promotion<\u002Fdiv>\n      <div style-before=\"content:'';position:absolute;inset:0;background-image:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27140%27%20height=%27140%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%27.82%27%20numOctaves=%273%27%20stitchTiles=%27stitch%27/%3E%3CfeColorMatrix%20type=%27saturate%27%20values=%270%27/%3E%3C/filter%3E%3Crect%20width=%27140%27%20height=%27140%27%20filter=%27url%28%23n%29%27%20opacity=%27.42%27/%3E%3C/svg%3E);opacity:.075;pointer-events:none;border-radius:inherit\" style=\"position:relative;width:620px;height:430px;background:#fbfcfc;border:1px solid #d9dfe0;border-radius:11px;padding:24px 28px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font-size:15px;line-height:1.7\">The pitch should lead with the quiet-authority angle. It matches the brand line the department signed off in March, and it is the one thing Vermeulen cannot claim.<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px\">\n          <div style=\"background:#fff;border:1px solid #e6eaeb;border-left:3px solid #2a5c9a;border-radius:6px;padding:9px 12px;display:flex;align-items:center;gap:10px\">\n            <span style=\"font-size:10px;font-weight:600;background:#ddeeff;color:#2a5c9a;padding:2px 6px;border-radius:3px;font-family:'DM Mono',monospace\">R1<\u002Fspan>\n            <span style=\"font-size:13.5px;flex:1\">Brand line signed off March<\u002Fspan>\n            <span style=\"font-size:10px;background:#fef0d0;color:#9a6b2a;padding:2px 6px;border-radius:3px;font-weight:500\">dept<\u002Fspan>\n            <span style=\"font-family:'DM Mono',monospace;font-size:11.5px;color:#91989a\">brand-v3.md<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e6eaeb;border-left:3px solid #2a7d4f;border-radius:6px;padding:9px 12px;display:flex;align-items:center;gap:10px\">\n            <span style=\"font-size:10px;font-weight:600;background:#d8f0e4;color:#2a7d4f;padding:2px 6px;border-radius:3px;font-family:'DM Mono',monospace\">R2<\u002Fspan>\n            <span style=\"font-size:13.5px;flex:1\">Vermeulen positioning teardown<\u002Fspan>\n            <span style=\"font-size:10px;background:#e0f0e8;color:#2a7d4f;padding:2px 6px;border-radius:3px;font-weight:500\">project<\u002Fspan>\n            <span style=\"font-family:'DM Mono',monospace;font-size:11.5px;color:#91989a\">teardown.md<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #d9dfe0;border-top:3px solid #0db5cc;border-radius:10px;padding:14px 16px\">\n          <div style=\"font-size:13.5px;font-weight:600;margin-bottom:5px\">Learned in this session<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#616a6c;line-height:1.55;margin-bottom:11px\">\"Quiet authority\" as the Nova pitch angle. It stays private to this session unless you move it up.<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <span style=\"background:#2f8d9a;color:#fff;border-radius:7px;padding:7px 13px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center\">Save to project<\u002Fspan>\n            <span style=\"background:#fff;border:1px solid #c9d0d1;border-radius:7px;padding:7px 13px;font-size:12.5px;display:inline-flex;align-items:center\">Propose to Tech — needs approval<\u002Fspan>\n            <span style=\"background:transparent;border:none;padding:7px 6px;font-size:12.5px;color:#81888a;display:inline-flex;align-items:center\">Keep private<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#91989a;line-height:1.55\">Nothing is promoted silently. Knowledge only moves up a rung when someone says so.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:620px;font:400 11.5px/1.55 'DM Sans',sans-serif;color:#81888a;border-left:2px solid #cfe8ee;padding-left:10px\">The scope model stays invisible until it matters, which suits people who never open a settings panel. Risk: they never learn the ladder exists.<\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n  <p style=\"margin:24px 0 0;font:12px/1.5 'DM Sans',sans-serif;color:rgba(0,0,0,.5)\">Try next: \"combine <a href=\"#2a\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">2a<\u002Fa> and <a href=\"#2c\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">2c<\u002Fa> into one session screen\" · \"show what a personal session looks like with no project rung\" · \"wireframe the approval a department promotion triggers\"<\u002Fp>\n<\u002Fsection>\n\n<section id=\"t1\" style=\"padding:40px 44px 36px\">\n  <div style=\"display:flex;align-items:baseline;gap:10px;margin:0 0 6px\">\n    <a href=\"#t1\" style=\"font:600 10px 'DM Mono',monospace;padding:3px 7px;background:#16191a;color:#fff;border-radius:4px;text-decoration:none\">1<\u002Fa>\n    <span style=\"font:600 13px/1.2 'DM Sans',sans-serif;color:#16191a\">Onboarding — invited employee joining an existing pod<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"font:400 12.5px/1.5 'DM Sans',sans-serif;color:#81888a;margin:0 0 26px;max-width:640px\">Sign in → error states → how-you-work survey → first chat. Wireframe fidelity: real structure and real OpenCrane tokens, placeholder copy where the final questions are still open.<\u002Fp>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start\">\n\n    <!-- 1a login -->\n    <div id=\"1a\" style=\"flex:none;display:flex;flex-direction:column;gap:9px\">\n      <div style=\"display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'DM Sans',sans-serif;color:rgba(0,0,0,.55)\"><a href=\"#1a\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">1a<\u002Fa>Sign in — invited, SSO first<\u002Fdiv>\n      <div style-before=\"content:'';position:absolute;inset:0;background-image:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27140%27%20height=%27140%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%27.82%27%20numOctaves=%273%27%20stitchTiles=%27stitch%27/%3E%3CfeColorMatrix%20type=%27saturate%27%20values=%270%27/%3E%3C/filter%3E%3Crect%20width=%27140%27%20height=%27140%27%20filter=%27url%28%23n%29%27%20opacity=%27.42%27/%3E%3C/svg%3E);opacity:.075;pointer-events:none;border-radius:inherit\" style=\"width:520px;height:420px;background:#fbfcfc;border:1px solid #d9dfe0;border-radius:11px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 56px;position:relative\">\n        <div style=\"position:absolute;top:18px;left:20px;display:inline-flex;align-items:center;gap:7px\">\n          <svg width=\"21\" height=\"16\" sc-camel-view-box=\"0 0 32 24\"><polygon points=\"10,16 3,5 13,15\" fill=\"#0d8ba0\"><\u002Fpolygon><polygon points=\"3,5 0,7.5 4.5,8.5\" fill=\"#f47920\"><\u002Fpolygon><polygon points=\"11,15 16,3 19,15\" fill=\"#22c7dd\"><\u002Fpolygon><polygon points=\"9,16 21,15 17,21 11,21\" fill=\"#0db5cc\"><\u002Fpolygon><polygon points=\"19,15 30,7 22,20\" fill=\"#66d7e6\"><\u002Fpolygon><\u002Fsvg>\n          <span style=\"font-size:14.5px;font-weight:600;letter-spacing:-.2px\">Open<span style=\"color:#0db5cc\">Crane<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"width:100%;display:flex;flex-direction:column;gap:14px\">\n          <div>\n            <div style=\"font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#91989a;margin-bottom:7px\">{{ orgLabel }}<\u002Fdiv>\n            <div style=\"font-size:24px;font-weight:600;letter-spacing:-.4px;margin-bottom:6px\">Sign in to your workspace<\u002Fdiv>\n            <div style=\"font-size:13.5px;color:#81888a;line-height:1.5\">You were invited by Elewa Group. Your work here stays private to you.<\u002Fdiv>\n          <\u002Fdiv>\n          <button style=\"width:100%;background:#2f8d9a;color:#fff;border:none;border-radius:7px;padding:11px 14px;font-size:13.5px;font-weight:500;cursor:pointer;box-shadow:0 1px 0 #23707b;transition:transform .18s cubic-bezier(.4,0,.2,1),box-shadow .18s cubic-bezier(.4,0,.2,1),background .18s cubic-bezier(.4,0,.2,1)\" style-hover=\"transform:translateY(-1px);box-shadow:0 2px 0 #16191a\" style-active=\"transform:translateY(0);box-shadow:0 1px 0 #23707b\">Continue with single sign-on<\u002Fbutton>\n          <div style=\"display:flex;align-items:center;gap:10px;color:#a7aeaf;font-size:11.5px\"><span style=\"flex:1;height:1px;background:#e6eaeb\"><\u002Fspan>or<span style=\"flex:1;height:1px;background:#e6eaeb\"><\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <label style=\"font-size:12.5px;color:#616a6c\">Work email<\u002Flabel>\n            <input type=\"text\" placeholder=\"you@elewa.ke\" style=\"width:100%;border:1px solid #c9d0d1;border-radius:6px;background:#fff;padding:9px 11px;font-size:13px;outline:none;color:#16191a\">\n            <button style=\"width:100%;background:transparent;border:1px solid #c9d0d1;border-radius:7px;padding:9px 14px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#16191a;cursor:pointer\" style-hover=\"background:#f1f4f5\">Email me a sign-in link<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:absolute;bottom:16px;font-size:11.5px;color:#a7aeaf\">self-hosted · data sovereign<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"width:520px;font:400 11.5px/1.55 'DM Sans',sans-serif;color:#81888a;border-left:2px solid #cfe8ee;padding-left:10px\">SSO is the primary path — the invite already carries the pod. The email field is only the magic-link fallback; there is no password on this screen.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <!-- 1b handoff -->\n    <div id=\"1b\" style=\"flex:none;display:flex;flex-direction:column;gap:9px\">\n      <div style=\"display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'DM Sans',sans-serif;color:rgba(0,0,0,.55)\"><a href=\"#1b\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">1b<\u002Fa>Identity-provider handoff<\u002Fdiv>\n      <div style-before=\"content:'';position:absolute;inset:0;background-image:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27140%27%20height=%27140%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%27.82%27%20numOctaves=%273%27%20stitchTiles=%27stitch%27/%3E%3CfeColorMatrix%20type=%27saturate%27%20values=%270%27/%3E%3C/filter%3E%3Crect%20width=%27140%27%20height=%27140%27%20filter=%27url%28%23n%29%27%20opacity=%27.42%27/%3E%3C/svg%3E);opacity:.075;pointer-events:none;border-radius:inherit\" style=\"position:relative;width:400px;height:420px;background:#fbfcfc;border:1px solid #d9dfe0;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 44px;text-align:center\">\n        <svg width=\"88\" height=\"18\" sc-camel-view-box=\"0 0 44 9\"><polygon points=\"0,9 4,1 8,9\" fill=\"#0db5cc\" style=\"animation:oc-flutter 1.6s ease-in-out infinite;transform-origin:4px 5px\"><\u002Fpolygon><polygon points=\"9,9 13,1 17,9\" fill=\"#0db5cc\" style=\"animation:oc-flutter 1.6s ease-in-out .16s infinite;transform-origin:13px 5px\"><\u002Fpolygon><polygon points=\"18,9 22,1 26,9\" fill=\"#0db5cc\" style=\"animation:oc-flutter 1.6s ease-in-out .32s infinite;transform-origin:22px 5px\"><\u002Fpolygon><polygon points=\"27,9 31,1 35,9\" fill=\"#0db5cc\" style=\"animation:oc-flutter 1.6s ease-in-out .48s infinite;transform-origin:31px 5px\"><\u002Fpolygon><polygon points=\"36,9 40,1 44,9\" fill=\"#f47920\" style=\"animation:oc-flutter 1.6s ease-in-out .64s infinite;transform-origin:40px 5px\"><\u002Fpolygon><\u002Fsvg>\n        <div style=\"font-size:16px;font-weight:600;letter-spacing:-.2px\">Taking you to your identity provider<\u002Fdiv>\n        <div style=\"font-size:13px;color:#81888a;line-height:1.55\">You will come back here signed in. Nothing about your account is stored outside your pod.<\u002Fdiv>\n        <button style=\"background:transparent;border:none;font-size:12.5px;color:#616a6c;cursor:pointer;text-decoration:underline\">Cancel and go back<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 1c magic link sent -->\n    <div id=\"1c\" style=\"flex:none;display:flex;flex-direction:column;gap:9px\">\n      <div style=\"display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'DM Sans',sans-serif;color:rgba(0,0,0,.55)\"><a href=\"#1c\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">1c<\u002Fa>Magic link sent<\u002Fdiv>\n      <div style-before=\"content:'';position:absolute;inset:0;background-image:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27140%27%20height=%27140%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%27.82%27%20numOctaves=%273%27%20stitchTiles=%27stitch%27/%3E%3CfeColorMatrix%20type=%27saturate%27%20values=%270%27/%3E%3C/filter%3E%3Crect%20width=%27140%27%20height=%27140%27%20filter=%27url%28%23n%29%27%20opacity=%27.42%27/%3E%3C/svg%3E);opacity:.075;pointer-events:none;border-radius:inherit\" style=\"position:relative;width:400px;height:420px;background:#fbfcfc;border:1px solid #d9dfe0;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 44px;text-align:center\">\n        <div style=\"font-size:20px;font-weight:600;letter-spacing:-.4px\">Check your email<\u002Fdiv>\n        <div style=\"font-size:13px;color:#81888a;line-height:1.55\">A sign-in link is on its way to <span style=\"font-family:'DM Mono',monospace;font-size:12.5px;color:#16191a\">jente@elewa.ke<\u002Fspan>. It works once and expires in 10 minutes.<\u002Fdiv>\n        <div style=\"width:100%;background:#f1f4f5;border:1px solid #e6eaeb;border-radius:8px;padding:11px 13px;text-align:left;font-size:12.5px;color:#616a6c;line-height:1.5\">Open the link on this device. Opening it elsewhere starts a session there instead.<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;font-size:12.5px;color:#91989a\">Resend in <span style=\"font-family:'DM Mono',monospace;color:#16191a\">0:42<\u002Fspan><\u002Fdiv>\n        <button style=\"background:transparent;border:none;font-size:12.5px;color:#616a6c;cursor:pointer;text-decoration:underline\">Use a different email<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 1d error -->\n    <div id=\"1d\" style=\"flex:none;display:flex;flex-direction:column;gap:9px\">\n      <div style=\"display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'DM Sans',sans-serif;color:rgba(0,0,0,.55)\"><a href=\"#1d\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">1d<\u002Fa>Sign-in rejected<\u002Fdiv>\n      <div style-before=\"content:'';position:absolute;inset:0;background-image:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27140%27%20height=%27140%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%27.82%27%20numOctaves=%273%27%20stitchTiles=%27stitch%27/%3E%3CfeColorMatrix%20type=%27saturate%27%20values=%270%27/%3E%3C/filter%3E%3Crect%20width=%27140%27%20height=%27140%27%20filter=%27url%28%23n%29%27%20opacity=%27.42%27/%3E%3C/svg%3E);opacity:.075;pointer-events:none;border-radius:inherit\" style=\"width:520px;height:420px;background:#fbfcfc;border:1px solid #d9dfe0;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 56px;position:relative\">\n        <div style=\"position:absolute;top:18px;left:20px;display:inline-flex;align-items:center;gap:7px\">\n          <svg width=\"21\" height=\"16\" sc-camel-view-box=\"0 0 32 24\"><polygon points=\"10,16 3,5 13,15\" fill=\"#0d8ba0\"><\u002Fpolygon><polygon points=\"3,5 0,7.5 4.5,8.5\" fill=\"#f47920\"><\u002Fpolygon><polygon points=\"11,15 16,3 19,15\" fill=\"#22c7dd\"><\u002Fpolygon><polygon points=\"9,16 21,15 17,21 11,21\" fill=\"#0db5cc\"><\u002Fpolygon><polygon points=\"19,15 30,7 22,20\" fill=\"#66d7e6\"><\u002Fpolygon><\u002Fsvg>\n          <span style=\"font-size:14.5px;font-weight:600;letter-spacing:-.2px\">Open<span style=\"color:#0db5cc\">Crane<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"width:100%;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font-size:24px;font-weight:600;letter-spacing:-.4px\">Sign in to your workspace<\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e8c9c4;border-top:3px solid #c1392b;border-radius:9px;padding:12px 14px\">\n            <div style=\"font-size:13px;font-weight:600;color:#c1392b;margin-bottom:4px\">Those details did not sign you in<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#616a6c;line-height:1.5\">Your identity provider rejected the attempt. Two more tries before the account locks for 15 minutes.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <label style=\"font-size:12.5px;color:#616a6c\">Work email<\u002Flabel>\n            <input type=\"text\" value=\"jente@elewa.ke\" style=\"width:100%;border:1px solid #c1392b;border-radius:6px;background:#fff;padding:9px 11px;font-size:13px;outline:none;color:#16191a\">\n            <label style=\"font-size:12.5px;color:#616a6c;margin-top:4px\">Password<\u002Flabel>\n            <input type=\"password\" value=\"passwordvalue\" style=\"width:100%;border:1px solid #c1392b;border-radius:6px;background:#fff;padding:9px 11px;font-size:13px;outline:none;color:#16191a\">\n            <div style=\"font-size:12px;color:#c1392b\">Check the email and password, or sign in with your organisation instead.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:9px\">\n            <button style=\"flex:1;background:#2f8d9a;color:#fff;border:none;border-radius:7px;padding:10px 14px;font-size:13.5px;font-weight:500;cursor:pointer;box-shadow:0 1px 0 #23707b;transition:transform .18s cubic-bezier(.4,0,.2,1),box-shadow .18s cubic-bezier(.4,0,.2,1),background .18s cubic-bezier(.4,0,.2,1)\" style-hover=\"transform:translateY(-1px);box-shadow:0 2px 0 #16191a\" style-active=\"transform:translateY(0);box-shadow:0 1px 0 #23707b\">Sign in<\u002Fbutton>\n            <button style=\"flex:1;background:transparent;border:1px solid #c9d0d1;border-radius:7px;padding:10px 14px;font-size:13px;cursor:pointer\" style-hover=\"background:#f1f4f5\">Use single sign-on<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"width:520px;font:400 11.5px/1.55 'DM Sans',sans-serif;color:#81888a;border-left:2px solid #f9c7b4;padding-left:10px\">The error names the mechanism and the consequence (attempts left, lockout length) rather than saying \"invalid credentials\", and always offers the SSO way out.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <!-- 1e survey step 1 -->\n    <div id=\"1e\" style=\"flex:none;display:flex;flex-direction:column;gap:9px\">\n      <div style=\"display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'DM Sans',sans-serif;color:rgba(0,0,0,.55)\"><a href=\"#1e\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">1e<\u002Fa>Survey 1 of 4 — who you are<\u002Fdiv>\n      <div style-before=\"content:'';position:absolute;inset:0;background-image:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27140%27%20height=%27140%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%27.82%27%20numOctaves=%273%27%20stitchTiles=%27stitch%27/%3E%3CfeColorMatrix%20type=%27saturate%27%20values=%270%27/%3E%3C/filter%3E%3Crect%20width=%27140%27%20height=%27140%27%20filter=%27url%28%23n%29%27%20opacity=%27.42%27/%3E%3C/svg%3E);opacity:.075;pointer-events:none;border-radius:inherit\" style=\"position:relative;width:640px;height:480px;background:#fbfcfc;border:1px solid #d9dfe0;border-radius:11px;padding:32px 44px;display:flex;flex-direction:column\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:22px\">\n          <span style=\"width:11px;height:10px;display:inline-block;clip-path:polygon(50% 0,100% 100%,0 100%);background:#0db5cc\"><\u002Fspan>\n          <span style=\"width:11px;height:10px;display:inline-block;clip-path:polygon(0 0,100% 0,50% 100%);background:#e6eaeb\"><\u002Fspan>\n          <span style=\"width:11px;height:10px;display:inline-block;clip-path:polygon(50% 0,100% 100%,0 100%);background:#e6eaeb\"><\u002Fspan>\n          <span style=\"width:11px;height:10px;display:inline-block;clip-path:polygon(0 0,100% 0,50% 100%);background:#e6eaeb\"><\u002Fspan>\n          <span style=\"font-size:11.5px;color:#91989a;margin-left:4px\">Step 1 of 4<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:24px;font-weight:600;letter-spacing:-.4px;margin-bottom:6px\">What should I call you?<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#81888a;line-height:1.5;margin-bottom:26px\">Four short questions shape how your assistant writes to you. You can change any of it later in Settings.<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:18px;flex:1\">\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <label style=\"font-size:13.5px;font-weight:500\">Preferred name<\u002Flabel>\n            <input type=\"text\" value=\"Jente\" style=\"width:300px;border:1px solid #c9d0d1;border-radius:6px;background:#fff;padding:9px 11px;font-size:13px;outline:none\">\n            <span style=\"font-size:12px;color:#91989a\">From your account: Jente Rosseel<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <label style=\"font-size:13.5px;font-weight:500\">Pronouns <span style=\"color:#91989a;font-weight:400\">— optional<\u002Fspan><\u002Flabel>\n            <div style=\"display:flex;gap:7px\">\n              <span style=\"border:1px solid #c9d0d1;background:#fff;border-radius:4px;padding:6px 12px;display:inline-flex;align-items:center;font-size:12.5px;cursor:pointer\">she/her<\u002Fspan>\n              <span style=\"border:1px solid #0db5cc;background:#f0f9fa;border-radius:4px;padding:6px 12px;display:inline-flex;align-items:center;font-size:12.5px;cursor:pointer;color:#0a94a7;font-weight:500\">he/him<\u002Fspan>\n              <span style=\"border:1px solid #c9d0d1;background:#fff;border-radius:4px;padding:6px 12px;display:inline-flex;align-items:center;font-size:12.5px;cursor:pointer\">they/them<\u002Fspan>\n              <span style=\"border:1px dashed #c9d0d1;background:transparent;border-radius:4px;padding:6px 12px;display:inline-flex;align-items:center;font-size:12.5px;cursor:pointer;color:#81888a\">Something x;padding:32px 44px;display:flex;flex-direction:column\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:22px\">\n          <span style=\"width:11px;height:10px;display:inline-block;clip-path:polygon(50% 0,100% 100%,0 100%);background:#0db5cc\"><\u002Fspan>\n          <span style=\"width:11px;height:10px;display:inline-block;clip-path:polygon(0 0,100% 0,50% 100%);background:#f47920\"><\u002Fspan>\n          <span style=\"width:11px;height:10px;display:inline-block;clip-path:polygon(50% 0,100% 100%,0 100%);background:#e6eaeb\"><\u002Fspan>\n          <span style=\"width:11px;height:10px;display:inline-block;clip-path:polygon(0 0,100% 0,50% 100%);background:#e6eaeb\"><\u002Fspan>\n          <span style=\"font-size:11.5px;color:#91989a;margin-left:4px\">Step 2 of 4<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:24px;font-weight:600;letter-spacing:-.4px;margin-bottom:6px\">What do you do here?<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#81888a;line-height:1.5;margin-bottom:26px\">This sets which department and project knowledge your assistant reaches for first.<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:18px;flex:1\">\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <label style=\"font-size:13.5px;font-weight:500\">Department<\u002Flabel>\n            <sc-raw-select style=\"width:300px;border:1px solid #c9d0d1;border-radius:6px;background:#fff;padding:9px 11px;font-size:13px;outline:none;color:#16191a\">\n              <option>Tech<\u002Foption><option>Product<\u002Foption><option>Marketing<\u002Foption><option>Finance<\u002Foption>\n            <\u002Fsc-raw-select>\n            <span style=\"font-size:12px;color:#91989a\">Pre-filled from your invite. Change it if it is wrong.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <label style=\"font-size:13.5px;font-weight:500\">Role<\u002Flabel>\n            <input type=\"text\" placeholder=\"e.g. Platform engineer\" style=\"width:300px;border:1px solid #c9d0d1;border-radius:6px;background:#fff;padding:9px 11px;font-size:13px;outline:none\">\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <label style=\"font-size:13.5px;font-weight:500\">Projects you are on<\u002Flabel>\n            <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n              <span style=\"border:1px solid #0db5cc;background:#f0f9fa;border-radius:4px;padding:6px 12px;display:inline-flex;align-items:center;font-size:12.5px;color:#0a94a7;font-weight:500\">Nova rebrand<\u002Fspan>\n              <span style=\"border:1px solid #c9d0d1;background:#fff;border-radius:4px;padding:6px 12px;display:inline-flex;align-items:center;font-size:12.5px\">Q3 strategy<\u002Fspan>\n              <span style=\"border:1px solid #c9d0d1;background:#fff;border-radius:4px;padding:6px 12px;display:inline-flex;align-items:center;font-size:12.5px\">Pod migration<\u002Fspan>\n              <span style=\"border:1px dashed #c9d0d1;border-radius:4px;padding:6px 12px;display:inline-flex;align-items:center;font-size:12.5px;color:#81888a\">+ 4 more<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;border-top:1px solid #e6eaeb;padding-top:16px\">\n          <button style=\"background:transparent;border:none;font-size:13px;color:#81888a;cursor:pointer\">Back<\u002Fbutton>\n          <button style=\"background:#2f8d9a;color:#fff;border:none;border-radius:7px;padding:9px 20px;font-size:13.5px;font-weight:500;cursor:pointer;box-shadow:0 1px 0 #23707b;transition:transform .18s cubic-bezier(.4,0,.2,1),box-shadow .18s cubic-bezier(.4,0,.2,1),background .18s cubic-bezier(.4,0,.2,1)\" style-hover=\"transform:translateY(-1px);box-shadow:0 2px 0 #16191a\" style-active=\"transform:translateY(0);box-shadow:0 1px 0 #23707b\">Continue<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 1g survey step 3 -->\n    <div id=\"1g\" style=\"flex:none;display:flex;flex-direction:column;gap:9px\">\n      <div style=\"display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'DM Sans',sans-serif;color:rgba(0,0,0,.55)\"><a href=\"#1g\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">1g<\u002Fa>Survey 3 of 4 — how you like to be written to<\u002Fdiv>\n      <div style-before=\"content:'';position:absolute;inset:0;background-image:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27140%27%20height=%27140%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%27.82%27%20numOctaves=%273%27%20stitchTiles=%27stitch%27/%3E%3CfeColorMatrix%20type=%27saturate%27%20values=%270%27/%3E%3C/filter%3E%3Crect%20width=%27140%27%20height=%27140%27%20filter=%27url%28%23n%29%27%20opacity=%27.42%27/%3E%3C/svg%3E);opacity:.075;pointer-events:none;border-radius:inherit\" style=\"position:relative;width:640px;height:480px;background:#fbfcfc;border:1px solid #d9dfe0;border-radius:11px;padding:32px 44px;display:flex;flex-direction:column\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:22px\">\n          <span style=\"width:11px;height:10px;display:inline-block;clip-path:polygon(50% 0,100% 100%,0 100%);background:#0db5cc\"><\u002Fspan>\n          <span style=\"width:11px;height:10px;display:inline-block;clip-path:polygon(0 0,100% 0,50% 100%);background:#f47920\"><\u002Fspan>\n          <span style=\"width:11px;height:10px;display:inline-block;clip-path:polygon(50% 0,100% 100%,0 100%);background:#0db5cc\"><\u002Fspan>\n          <span style=\"width:11px;height:10px;display:inline-block;clip-path:polygon(0 0,100% 0,50% 100%);background:#e6eaeb\"><\u002Fspan>\n          <span style=\"font-size:11.5px;color:#91989a;margin-left:4px\">Step 3 of 4<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:24px;font-weight:600;letter-spacing:-.4px;margin-bottom:6px\">How should I write to you?<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#81888a;line-height:1.5;margin-bottom:26px\">These answers shape how your assistant writes to you. Only you can see or change them.<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:22px;flex:1\">\n          <div style=\"display:flex;flex-direction:column;gap:9px\">\n            <label style=\"font-size:13.5px;font-weight:500\">Tone<\u002Flabel>\n            <div style=\"display:flex;background:#eceff0;border-radius:7px;padding:3px;gap:2px;width:400px\">\n              <div style=\"flex:1;text-align:center;padding:8px 4px;font-size:12.5px;border-radius:5px;background:#fff;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)\">Direct<\u002Fdiv>\n              <div style=\"flex:1;text-align:center;padding:8px 4px;font-size:12.5px;border-radius:5px;color:#616a6c\">Balanced<\u002Fdiv>\n              <div style=\"flex:1;text-align:center;padding:8px 4px;font-size:12.5px;border-radius:5px;color:#616a6c\">Warm<\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-size:12px;color:#91989a\">Direct — answer first, reasoning only when you ask for it.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px\">\n            <label style=\"font-size:13.5px;font-weight:500\">Length<\u002Flabel>\n            <div style=\"display:flex;background:#eceff0;border-radius:7px;padding:3px;gap:2px;width:400px\">\n              <div style=\"flex:1;text-align:center;padding:8px 4px;font-size:12.5px;border-radius:5px;color:#616a6c\">Brief<\u002Fdiv>\n              <div style=\"flex:1;text-align:center;padding:8px 4px;font-size:12.5px;border-radius:5px;background:#fff;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)\">Thorough with references<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;width:400px\">\n            <div>\n              <div style=\"font-size:13.5px;font-weight:500\">Always show where an answer came from<\u002Fdiv>\n              <div style=\"font-size:12px;color:#91989a;margin-top:3px\">Citation strips under every grounded reply.<\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"width:44px;height:24px;border-radius:999px;background:#0db5cc;position:relative;flex-shrink:0\"><span style=\"position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:999px;background:#fff\"><\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;border-top:1px solid #e6eaeb;padding-top:16px\">\n          <button style=\"background:transparent;border:none;font-size:13px;color:#81888a;cursor:pointer\">Back<\u002Fbutton>\n          <button style=\"background:#2f8d9a;color:#fff;border:none;border-radius:7px;padding:9px 20px;font-size:13.5px;font-weight:500;cursor:pointer;box-shadow:0 1px 0 #23707b;transition:transform .18s cubic-bezier(.4,0,.2,1),box-shadow .18s cubic-bezier(.4,0,.2,1),background .18s cubic-bezier(.4,0,.2,1)\" style-hover=\"transform:translateY(-1px);box-shadow:0 2px 0 #16191a\" style-active=\"transform:translateY(0);box-shadow:0 1px 0 #23707b\">Continue<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"width:640px;font:400 11.5px/1.55 'DM Sans',sans-serif;color:#81888a;border-left:2px solid #cfe8ee;padding-left:10px\">Every answer here maps to a line in SOUL.md. Naming the file is the provenance move — the user can see and undo what the survey wrote.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <!-- 1h survey step 4 -->\n    <div id=\"1h\" style=\"flex:none;display:flex;flex-direction:colu
