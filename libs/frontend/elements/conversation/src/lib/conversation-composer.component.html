<form class="conversation-composer" (submit)="$event.preventDefault(); submit()">
	<div class="conversation-composer__leading"><ng-content select="[conversation-composer-leading]" /></div>
	<label class="conversation-composer__label" [for]="'conversation-composer-field'">{{ label() }}</label>
	<textarea id="conversation-composer-field" pTextarea rows="3" [value]="draft()" [placeholder]="placeholder()" [disabled]="state() !== states.Available" (input)="changeDraft($event)" (keydown)="handleKeydown($event)"></textarea>
	<footer>
		<div class="conversation-composer__footer"><ng-content select="[conversation-composer-footer]" /></div>
		<p-button type="submit" label="Send" icon="pi pi-send" [loading]="state() === states.Submitting" [disabled]="state() !== states.Available || draft().trim().length === 0" />
	</footer>
</form>
