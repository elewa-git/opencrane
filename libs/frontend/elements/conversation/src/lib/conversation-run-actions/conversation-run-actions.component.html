<section class="conversation-run-actions" aria-label="Assistant work controls">
	<p class="conversation-run-actions__status" role="status"><strong>{{ presentation().statusLabel }}</strong><span>{{ presentation().detail }}</span></p>
	@if (presentation().canStop)
	{
		<p-button label="Stop" icon="pi pi-stop-circle" severity="danger" size="small" [loading]="presentation().busy" [disabled]="presentation().busy" (onClick)="stopRequested.emit()" />
	}
	@if (presentation().error)
	{
		<p-message severity="error" [text]="presentation().error!" />
	}
</section>
