<span
	class="wo-avatar"
	[class.wo-avatar--brand]="tone() === tones.Brand"
	[class.wo-avatar--blue]="tone() === tones.Blue"
	[class.wo-avatar--green]="tone() === tones.Green"
	[class.wo-avatar--amber]="tone() === tones.Amber"
	[class.wo-avatar--neutral]="tone() === tones.Neutral"
	[class.wo-avatar--compact]="size() === sizes.Compact"
	[class.wo-avatar--small]="size() === sizes.Small"
	[class.wo-avatar--medium]="size() === sizes.Medium"
	[class.wo-avatar--large]="size() === sizes.Large"
	[attr.aria-label]="label()"
	[attr.aria-hidden]="label() ? null : true"
>{{ initials() }}</span>
