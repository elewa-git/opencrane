<div class="wo-section" [class.wo-section--rail]="variant() === variants.Rail">
	<button
		[id]="sectionId() + '-trigger'"
		type="button"
		class="wo-section__header"
		[attr.aria-controls]="sectionId() + '-panel'"
		[attr.aria-expanded]="open()"
		(click)="toggle()"
	>
		@if (variant() === variants.Rail) {
			<i class="pi pi-chevron-down wo-section__chevron" [class.wo-section__chevron--closed]="!open()"></i>
			<span class="wo-section__title">{{ title() }}</span>
		} @else {
			<span class="wo-section__title">{{ title() }}</span>
			<i class="pi pi-chevron-down wo-section__chevron" [class.wo-section__chevron--closed]="!open()"></i>
		}
	</button>
	@if (open()) {
		<div
			[id]="sectionId() + '-panel'"
			class="wo-section__body"
			role="region"
			[attr.aria-labelledby]="sectionId() + '-trigger'"
		>
			<ng-content />
		</div>
	}
</div>
