<div
	class="wo-ledger"
	[class.wo-ledger--observation]="kind() === kinds.Observation"
	[class.wo-ledger--policy]="kind() === kinds.Policy"
	[class.wo-ledger--action]="kind() === kinds.Action"
>
	<span class="wo-ledger__id wo-mono">{{ entryId() }}</span>
	<div class="wo-ledger__body">
		<p class="wo-ledger__label" [class.wo-ledger__label--dimmed]="dimmed()">{{ label() }}</p>
		<div class="wo-ledger__meta">
			@if (scope(); as scopeLevel) {
				<wo-scope-chip [label]="scopeLevel" [tone]="scopeTone()" />
			}
			@if (entryRef(); as refValue) {
				<span class="wo-ledger__ref wo-mono">{{ refValue }}</span>
			}
		</div>
	</div>
	@if (status(); as statusValue) {
		<span class="wo-ledger__status wo-mono">{{ statusValue }}</span>
	}
</div>
