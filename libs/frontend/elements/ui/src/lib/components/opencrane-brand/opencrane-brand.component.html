<div class="wo-opencrane-brand" [class.wo-opencrane-brand--navigation]="appearance() === appearances.Navigation" aria-label="OpenCrane">
	@if (appearance() === appearances.Navigation) {
		<svg class="wo-opencrane-brand__crane" viewBox="0 0 120 120" aria-hidden="true">
			<polygon points="14,70 50,58 40,82" fill="var(--oc-brand-crane-deep)" />
			<polygon points="50,58 42,14 72,52" fill="var(--oc-brand-crane-light)" />
			<polygon points="50,58 72,52 60,86" fill="var(--oc-brand-crane-front)" />
			<polygon points="72,52 60,86 88,74" fill="var(--oc-brand-crane-body)" />
			<polygon points="50,58 60,86 72,52" fill="var(--oc-brand-crane-fold)" />
			<polygon points="72,52 70,30 90,46" fill="var(--oc-brand-crane-front)" />
			<polygon points="70,30 90,46 92,30" fill="var(--oc-brand-crane-deep)" />
			<polygon points="92,30 110,32 90,42" fill="var(--oc-brand-crane-beak)" />
		</svg>
		<strong><span>Open</span><span>Crane</span></strong>
	} @else {
		<span class="wo-opencrane-brand__mark" aria-hidden="true"></span>
		<span>OpenCrane</span>
	}
</div>
