@if (items().length > 0) {
	<section class="wo-attachment-tray" aria-label="Message attachments" aria-live="polite">
		<div class="wo-attachment-tray__items" role="list">
			@for (item of items(); track item.id) {
				<span role="listitem"><wo-conversation-attachment-chip [item]="item" (actionRequested)="request($event)" /></span>
			}
		</div>
		<span class="wo-attachment-tray__count wo-mono">{{ readyCount() }} of {{ items().length }} ready</span>
	</section>
}
