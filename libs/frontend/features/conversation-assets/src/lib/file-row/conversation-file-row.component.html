<div
	class="wo-file-row"
	[class.wo-file-row--agent]="item().provenance === provenance.AgentOutput"
	[class.wo-file-row--failed]="item().state === states.Failed"
	[class.wo-file-row--muted]="item().state === states.Inaccessible || item().state === states.Expired || item().state === states.Removed || item().state === states.Unavailable"
>
	<span class="wo-file-row__type wo-mono">{{ typeLabel() }}</span>
	<span class="wo-file-row__name">{{ item().displayName }}</span>
	<span class="wo-file-row__state">{{ item().detail }}</span>
	@if (item().canRetry) {
		<p-button label="Retry" severity="contrast" [link]="true" size="small" (onClick)="act(actions.Retry)" />
	} @else if (item().state === states.Ready) {
		<p-button label="Open" severity="contrast" [link]="true" size="small" (onClick)="act(actions.Open)" />
	}
	@if (item().messageId !== null) {
		<p-button icon="pi pi-arrow-up-right" severity="contrast" [text]="true" [rounded]="true" size="small" [ariaLabel]="'Show ' + item().displayName + ' in conversation'" (onClick)="act(actions.FocusMessage)" />
	}
</div>
