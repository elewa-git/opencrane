<section class="onboarding-continuation" aria-label="Conversation continuation">
	<div class="onboarding-continuation__copy" role="status"><i class="pi pi-lock" aria-hidden="true"></i><span><strong>{{ continuation().heading }}</strong><small>{{ continuation().detail }}</small></span></div>
	<p-button label="Start a new chat" icon="pi pi-plus" [disabled]="!continuation().canStartNewChat" (onClick)="newChatRequested.emit()" />
</section>
