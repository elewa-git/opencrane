<section class="onboarding-history" aria-labelledby="onboarding-history-title">
	<header>
		<div>
			<small>Onboarding history · Read-only</small>
			<div class="onboarding-history__title-row"><h1 id="onboarding-history-title">{{ presentation().title }}</h1><wo-scope-chip label="Completed" [tone]="chipTone" [appearance]="chipAppearance" /></div>
			<p>Completed with {{ presentation().personaName }} at {{ presentation().completedLabel }}.</p>
		</div>
	</header>
	<section class="onboarding-history__transcript" aria-label="Completed onboarding messages">
		<div class="onboarding-history__transcript-measure">
			@for (entry of messages(); track entry.message.id) {
				<div class="onboarding-history__message"><wo-conversation-message [message]="entry.message"><wo-conversation-rich-text conversation-message-rich-card [presentation]="entry.richText" /></wo-conversation-message></div>
			}
		</div>
	</section>
	<wo-conversation-onboarding-continuation [continuation]="continuation()" (newChatRequested)="newChatRequested.emit()" />
</section>
