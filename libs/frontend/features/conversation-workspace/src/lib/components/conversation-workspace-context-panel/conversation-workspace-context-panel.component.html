<aside
  id="conversation-workspace-context-panel"
  class="context-panel"
  aria-label="Conversation context"
>
  @if (activityVisible()) {
    <wo-conversation-activity
      [rows]="activityRows()"
      title="Activity"
      emptyLabel="No activity needs your attention."
      [readState]="activityReadState()"
      [error]="activityError()"
      [refreshAvailable]="activityRefreshAvailable()"
      (refreshRequested)="activityRefreshRequested.emit()"
      (targetRequested)="activityTargetRequested.emit($event)"
    >
      <p-button
        conversation-activity-header-action
        ariaLabel="Close activity pane"
        icon="pi pi-times"
        [rounded]="true"
        [text]="true"
        size="small"
        (onClick)="closed.emit()"
      />
    </wo-conversation-activity>
  } @else {
    <div class="context-panel__close">
      <p-button
        ariaLabel="Close context pane"
        icon="pi pi-times"
        [rounded]="true"
        [text]="true"
        size="small"
        (onClick)="closed.emit()"
      />
    </div>
  }
  @if (filesVisible()) {
  <ng-template #filesPanel>
    <wo-conversation-files-panel
      [items]="assets()"
      (actionRequested)="assetActionRequested.emit($event)"
    />
  </ng-template>
  @if (computerReviewVisible()) {
    <p-tabs [value]="activeSection()" (valueChange)="selectSection($event)">
      <p-tablist aria-label="Conversation context sections">
        <p-tab [value]="sections.Files">Files</p-tab>
        <p-tab [value]="sections.ComputerReview">Computer review</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel [value]="sections.Files">
          <ng-container [ngTemplateOutlet]="filesPanel" />
        </p-tabpanel>
        <p-tabpanel [value]="sections.ComputerReview">
          <wo-conversation-computer-review
            [busy]="computerReviewBusy()"
            [error]="computerReviewError()"
            [file]="computerFile()"
            [diff]="computerDiff()"
            [command]="computerCommand()"
            [browserTargets]="computerBrowserTargets()"
            [screenshotUrl]="computerScreenshotUrl()"
            [preview]="computerPreview()"
            (inspectRequested)="computerInspectRequested.emit($event)"
            (commandRequested)="computerCommandRequested.emit($event)"
            (browserRefreshRequested)="computerBrowserRefreshRequested.emit()"
            (pageRequested)="computerPageRequested.emit($event)"
            (screenshotRequested)="computerScreenshotRequested.emit($event)"
            (previewRequested)="computerPreviewRequested.emit($event)"
          />
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  } @else {
    <ng-container [ngTemplateOutlet]="filesPanel" />
  }
  }
</aside>
