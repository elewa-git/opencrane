<aside class="conversation-list" aria-labelledby="conversation-list-title">
	<header><div><small>Workspace</small><h1 id="conversation-list-title">Chats</h1></div><p-button label="New" icon="pi pi-plus" size="small" (onClick)="createRequested.emit()" /></header>
	@if (items().length === 0) { <p class="conversation-list__empty">No conversations yet. Start with your Agent or invite a participant.</p> }
	@else {
		<nav aria-label="Conversations"><ul>
			@for (item of items(); track item.id) {
				<li><button type="button" [class.conversation-list__item--selected]="item.id === selectedId()" [attr.aria-current]="item.id === selectedId() ? 'page' : null" (click)="selected.emit(item.id)"><span><strong>{{ item.title }}</strong><small>{{ item.modeLabel }} · {{ item.participantLabel }}</small></span><time>{{ item.updatedLabel }}</time></button></li>
			}
		</ul></nav>
	}
</aside>
