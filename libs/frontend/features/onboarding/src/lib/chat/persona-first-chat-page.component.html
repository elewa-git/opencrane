@if (preparing()) {
	<wo-journey-shell title="Preparing your first conversation" description="Loading your assistant and your saved setup progress." [layout]="layouts.Compact" [busy]="true">
		<div class="wo-onboarding__loading" role="status"><p-progressspinner ariaLabel="Loading first conversation" /></div>
	</wo-journey-shell>
} @else if (chat.error() && !chat.hasValue()) {
	<wo-journey-shell title="We could not resume your first conversation" description="Your saved answers are still available when the connection returns." [layout]="layouts.Compact">
		<p-message journey-status severity="error" [closable]="false">We could not load your setup progress. Retry to continue where you left off.</p-message>
		<p-button journey-actions label="Retry" icon="pi pi-refresh" (onClick)="retry()" />
	</wo-journey-shell>
} @else if (view(); as presentation) {
	<wo-persona-first-chat
		[identity]="presentation.identity"
		[provenance]="presentation.provenance"
		[transcript]="presentation.transcript"
		[currentQuestion]="presentation.currentQuestion"
		[state]="presentationState()"
		[draftAnswer]="draftAnswer()"
		[statusMessage]="actionError() ?? undefined"
		completionMessage="Your setup is complete. You can start a conversation with your assistant."
		(draftAnswerChange)="updateDraft($event)"
		(answerSubmitted)="submitAnswer($event)"
		(retryRequested)="retry()"
	/>
} @else {
	<wo-journey-shell title="Your first conversation could not be loaded" description="We could not load the assistant settings needed to continue." [layout]="layouts.Compact">
		<p-message journey-status severity="error" [closable]="false">Retry to load your saved setup progress.</p-message>
		<p-button journey-actions label="Retry" icon="pi pi-refresh" (onClick)="retry()" />
	</wo-journey-shell>
}
