@let state = snapshot();
@if (state.result; as result) {
	<wo-journey-shell title="Your persona is active" description="This result describes how you asked your agent to collaborate. It is not a personality diagnosis." [layout]="layouts.Wide">
		@if (actionError(); as error) {
			<p-message journey-status severity="error" [closable]="false">{{ error }}</p-message>
		} @else {
			<p-message journey-status severity="success" [closable]="false">Your assistant will use these settings for future replies. Work already started keeps its current settings.</p-message>
		}
		<wo-persona-result-evidence [result]="result" [questions]="state.questions" />
		@if (actionError()) {
			<p-button journey-actions label="Retry" icon="pi pi-refresh" (onClick)="retryRequested.emit()" />
		}
	</wo-journey-shell>
} @else {
	<wo-journey-shell title="Your active persona is unavailable" description="We could not load your approved assistant settings." [layout]="layouts.Compact">
		<p-message journey-status severity="error" [closable]="false">Reload your saved settings to continue.</p-message>
		<p-button journey-actions label="Retry" icon="pi pi-refresh" (onClick)="retryRequested.emit()" />
	</wo-journey-shell>
}
