@if (routineId() === null) {
	<wo-section-heading title="Routine unavailable" subtitle="This routine link is not valid." [level]="headingLevel"><a heading-actions pButton routerLink="/routines" class="p-button">Back to routines</a></wo-section-heading>
} @else if (screen.editing()) {
	<wo-routine-definition-form [mode]="screen.editor.mode()" [draft]="screen.editor.draft()" [audienceChoices]="screen.editor.audienceChoices()" [serviceChoices]="screen.editor.serviceChoices()" [timezoneChoices]="screen.editor.timezones" [preview]="screen.editor.preview()" [previewStale]="screen.editor.previewStale()" [previewLoading]="screen.editor.previewLoading()" [previewError]="screen.editor.previewError()" [commandState]="screen.editor.commandState()" [commandError]="screen.editor.commandError()" [canSubmit]="screen.editor.canSubmit()" (scheduleModeChanged)="screen.editor.setScheduleMode($event)" (localTimeChanged)="screen.editor.setLocalTime($event)" (weekdayChanged)="screen.editor.setWeekday($event)" (expressionChanged)="screen.editor.setExpression($event)" (timezoneChanged)="screen.editor.setTimezone($event)" (instructionChanged)="screen.editor.setInstruction($event)" (previewRequested)="screen.editor.requestPreview()" (submitted)="screen.submitRevision()" (cancelled)="screen.cancelRevision()" />
} @else {
	<wo-routine-detail [state]="screen.detail.state()" [detail]="screen.detail.detail()" [capabilities]="screen.detail.capabilities()" [commandState]="screen.controls.state()" [retryAction]="screen.controls.retryAction()" [error]="screen.detail.error()" [commandError]="screen.controls.error()" (refreshRequested)="screen.refreshDetails()" (reviseRequested)="screen.revise()" (pauseRequested)="screen.control(actions.Pause)" (resumeRequested)="screen.control(actions.Resume)" (retireRequested)="screen.control(actions.Retire)" (runNowRequested)="screen.control(actions.RunNow)" (retryRequested)="screen.control($event)" />
	<wo-routine-history [state]="screen.history.state()" [rows]="screen.history.rows()" [hasMore]="screen.history.hasMore()" [loadingMore]="screen.history.loadingMore()" [error]="screen.history.error()" [loadMoreError]="screen.history.loadMoreError()" (refreshRequested)="screen.history.refresh()" (loadMoreRequested)="screen.history.loadMore()" />
}
