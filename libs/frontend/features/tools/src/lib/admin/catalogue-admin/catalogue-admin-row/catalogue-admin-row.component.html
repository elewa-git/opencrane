							<td>
								<div class="wo-mono wo-admin__name">{{ server().name }}</div>
								<div class="wo-admin__desc">{{ server().description }}</div>
							</td>
							<td class="wo-admin__muted">{{ server().publisher }}</td>
							<td><wo-scope-chip [label]="typeChips[server().type].label" [tone]="typeChips[server().type].tone" /></td>
							<td class="wo-admin__muted">{{ server().entitlementSummary }}</td>
							<td><wo-scope-chip [label]="approvalChips[server().approvalStatus].label" [tone]="approvalChips[server().approvalStatus].tone" /></td>
							<td class="wo-admin__actions">
								@switch (server().approvalStatus) {
									@case (status.PendingReview) {
										<button pButton [disabled]="busy()" type="button" size="small" [text]="true" (click)="approveRequested.emit()">Approve</button>
										<button pButton [disabled]="busy()" type="button" size="small" [text]="true" severity="danger" (click)="rejectRequested.emit()">Reject</button>
									}
									@case (status.Approved) {
										<button pButton [disabled]="busy()" type="button" size="small" [text]="true" (click)="publishRequested.emit()">Publish</button>
									}
									@case (status.Published) {
										<button pButton [disabled]="busy()" type="button" size="small" [text]="true" severity="danger" (click)="enabledRequested.emit(false)">Disable</button>
									}
									@case (status.Disabled) {
										<button pButton [disabled]="busy()" type="button" size="small" [text]="true" (click)="enabledRequested.emit(true)">Re-enable</button>
									}
								}
							</td>
