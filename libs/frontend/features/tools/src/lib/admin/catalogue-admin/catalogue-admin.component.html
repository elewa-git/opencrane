<div class="wo-admin">
	<div class="wo-admin__inner">
		@if (store.canAdminister()) {
			<wo-section-heading
				title="MCP Catalogue"
				[subtitle]="store.servers().length + ' servers · ' + store.pendingCount() + ' awaiting review. Approve and publish servers after grants are managed through central authorization.'"
			/>

			<wo-resource-feedback [loading]="store.loading()" [error]="store.error() ?? store.readError()" [retryAvailable]="store.readError() !== null" (retryRequested)="store.refresh()" />
			<table class="wo-table">
				<thead>
					<tr>
						<th>Server</th>
						<th>Publisher</th>
						<th>Type</th>
						<th>Entitlements</th>
						<th>Status</th>
						<th></th>
					</tr>
				</thead>
				<tbody>
					@for (server of store.servers(); track server.id) {
						<tr wo-catalogue-admin-row [server]="server" [busy]="store.busy().has(server.id)" (approveRequested)="store.approve(server)" (publishRequested)="store.publish(server)" (rejectRequested)="store.reject(server)" (enabledRequested)="store.setEnabled(server, $event)"></tr>
					}
				</tbody>
			</table>
		} @else {
			<div class="wo-admin__denied">
				<h2>Admins only</h2>
				<p>The MCP catalogue is managed by your organisation's administrators.</p>
			</div>
		}
	</div>
</div>
