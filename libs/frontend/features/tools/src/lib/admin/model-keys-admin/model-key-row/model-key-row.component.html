							<td>
								<div class="wo-keys__name">{{ row().label }}</div>
								<div class="wo-mono wo-admin__muted">{{ row().provider }}</div>
							</td>
							<td>
								@if (row().configured) {
									<wo-scope-chip label="configured" [tone]="chipTones.Success" />
								} @else {
									<wo-scope-chip label="not set" [tone]="chipTones.Neutral" />
								}
							</td>
							<td><wo-scope-chip [label]="badgeStyle().label" [tone]="badgeStyle().tone" [appearance]="chipAppearances.Soft" /></td>
							<td class="wo-admin__muted">{{ row().updatedAtLabel }}</td>
							<td>
								<input
									pInputText
									class="wo-keys__input"
									type="password"
									[attr.aria-label]="row().label + ' API key'"
									autocomplete="off"
									placeholder="Paste API key"
									[disabled]="busy()"
									[value]="draft()"
									(input)="editDraft($event)"
									(keyup.enter)="submitted.emit()"
								/>
							</td>
							<td class="wo-admin__actions">
								<button
									type="button"
									pButton
									size="small"
									[text]="true"
									[disabled]="busy() || draft().trim().length === 0"
									(click)="submitted.emit()"
								>
									{{ row().configured ? "Refresh" : "Save" }}
								</button>
								@if (row().configured) {
									<button
										type="button"
										pButton
										size="small"
										[text]="true"
										severity="danger"
										[disabled]="busy()"
										(click)="removeRequested.emit()"
									>
										Remove
									</button>
								}
							</td>
