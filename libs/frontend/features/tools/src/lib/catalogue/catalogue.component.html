<div class="wo-tools-page wo-scrollable">
	<div class="wo-tools-page__inner">
		<wo-section-heading
			title="Tool catalogue"
			subtitle="Servers your administrator has approved for you. Install one to make its tools available to your agent."
		/>

		<wo-resource-feedback [loading]="store.loading()" [error]="store.error() ?? store.readError()" [retryAvailable]="store.readError() !== null" (retryRequested)="store.refresh()" />
		<div class="wo-cat__toolbar">
			<div class="wo-cat__search">
				<i class="pi pi-search"></i>
				<input class="wo-text-input" type="text" aria-label="Search tools" placeholder="Search tools…" [value]="store.search()" (input)="onSearch($event)" />
			</div>
			<select aria-label="Connection type" class="wo-select" [value]="store.typeFilter()" (change)="onTypeFilter($event)">
				<option [value]="filters.All">All types</option>
				<option [value]="serverType.RemoteOauth">OAuth</option>
				<option [value]="serverType.SingleUser">API token</option>
				<option [value]="serverType.MultiUser">Multi-user</option>
			</select>
		</div>

		<div class="wo-cat__grid">
			@for (server of store.servers(); track server.id) {
				<wo-tool-card [server]="server" [installed]="store.installedIds().has(server.id)" [busy]="store.busy().has(server.id)" (installRequested)="store.install(server.id)" />
			} @empty {
				<p class="wo-cat__empty">No tools match your search.</p>
			}
		</div>

		<div class="wo-callout wo-callout--info wo-cat__note">
			You're seeing the {{ store.total() }} servers your administrator has approved and assigned to you. You can't see or
			install servers that haven't been approved — <a [routerLink]="['/tools']">manage your installed tools →</a>
		</div>
	</div>
</div>
