							<td class="wo-mono wo-mytools__name">{{ row().server.name }}</td>
							<td><wo-scope-chip [label]="typeChips[row().server.type].label" [tone]="typeChips[row().server.type].tone" /></td>
							<td>
								<span
									class="wo-tools__status"
									[class.wo-tools__status--neutral]="connectionIndicators[row().installed.connectionStatus].tone === chipTones.Neutral"
									[class.wo-tools__status--info]="connectionIndicators[row().installed.connectionStatus].tone === chipTones.Info"
									[class.wo-tools__status--success]="connectionIndicators[row().installed.connectionStatus].tone === chipTones.Success"
									[class.wo-tools__status--warning]="connectionIndicators[row().installed.connectionStatus].tone === chipTones.Warning"
									[class.wo-tools__status--danger]="connectionIndicators[row().installed.connectionStatus].tone === chipTones.Danger"
								>
									<span class="wo-tools__status-dot" [class.wo-tools__status-dot--pulse]="connectionIndicators[row().installed.connectionStatus].pulse"></span>
									{{ connectionIndicators[row().installed.connectionStatus].label }}
								</span>
							</td>
							<td class="wo-mytools__muted">{{ row().installed.lastUsed ?? "—" }}</td>
							<td class="wo-mytools__actions"><button type="button" class="wo-tools__act wo-tools__act--muted" [disabled]="busy()" (click)="uninstallRequested.emit()">Uninstall</button></td>
