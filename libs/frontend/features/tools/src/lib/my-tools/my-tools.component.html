<div class="wo-tools-page wo-scrollable">
	<div class="wo-tools-page__inner">
		<wo-section-heading
			title="My tools"
			subtitle="Servers you've installed. Shared-key servers are ready to use; personal credential activation is not available yet."
		/>

		<wo-resource-feedback [loading]="store.loading()" [error]="store.error() ?? store.readError()" [retryAvailable]="store.readError() !== null" (retryRequested)="store.refresh()" />
		@if (store.rows().length > 0) {
			<table class="wo-table wo-mytools__table">
				<thead>
					<tr>
						<th>Server</th>
						<th>Type</th>
						<th>Status</th>
						<th>Last used</th>
						<th></th>
					</tr>
				</thead>
				<tbody>
					@for (row of store.rows(); track row.server.id) {
						<tr wo-installed-tool-row [row]="row" [busy]="store.busy().has(row.server.id)" (uninstallRequested)="store.uninstall(row.server.id)"></tr>
					}
				</tbody>
			</table>
		} @else {
			<p class="wo-mytools__empty">You haven't installed any tools yet.</p>
		}

		<a class="wo-dashed-button wo-mytools__browse" [routerLink]="['/tools/catalogue']">
			<i class="pi pi-plus"></i>
			Browse the catalogue
		</a>
	</div>
</div>
